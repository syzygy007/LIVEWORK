<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your room. LIVEWORK</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="room.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Room">
<link rel="stylesheet" href="lw.css?v=4">
<script src="lw-config.js?v=3"></script>
<script src="lw-app.js?v=1" defer></script>
<style>
.wrap{width:min(1040px,100% - 96px);margin:0 auto}
@media (max-width:720px){.wrap{width:calc(100% - 40px)}}
.nav{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
body{padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:72px}
.nav img{height:20px}
.nav .who{font-size:14px;color:var(--stone)}
.nav .who b{color:var(--ink);font-weight:600}
/* door */
.door{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:48px 0}
.door .box{width:min(440px,100%);background:var(--white);border:1px solid var(--line);padding:40px;display:grid;gap:20px}
.door h1{font-size:40px}
.door p{color:var(--stone)}
.door .btn{width:100%}
.code{letter-spacing:.4em;font-size:24px;font-weight:800;text-align:center}
.err{color:var(--warn);font-size:14px;font-weight:600}
.btn[disabled]{opacity:.5;cursor:wait}
/* room */
.room{padding:56px 0 96px}
.room h1{font-size:clamp(40px,6vw,72px);max-width:12em}
.room .lede{margin:20px 0 48px 30px}
@media (max-width:720px){.room .lede{margin-left:0}}
.srch{border-top:2px solid var(--ink);padding:28px 0 40px}
.srch header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;flex-wrap:wrap;margin-bottom:24px}
.srch h2{font-size:30px}
.srch .meta{font-size:14px;color:var(--stone);margin-top:6px}
.ladder{display:flex;gap:4px;align-items:center;font-size:12px;font-weight:600;color:var(--stone)}
.ladder span{padding:6px 10px;background:var(--wall);border-radius:var(--r)}
.ladder span.on{background:var(--ink);color:var(--white)}
.cands{display:grid;gap:12px}
.cand{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;display:grid;grid-template-columns:1.6fr 1fr auto;gap:24px;align-items:center}
@media (max-width:720px){.cand{grid-template-columns:1fr}}
.cand b{font-weight:600;font-size:18px;display:block}
.cand .t{color:var(--stone);font-size:14px}
.cand .stage{font-size:13px;font-weight:600}
.cand .stage i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--yellow);margin-right:8px;vertical-align:middle;font-style:normal}
.cand .stage.done i{background:var(--ok)}
.cand .acts{display:flex;gap:8px;flex-wrap:wrap}
.cand .acts .btn{min-height:40px;padding:0 14px;font-size:14px}
.cand .fb{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px;font-size:14px;color:var(--stone)}
.cand .fb b{font-size:14px;display:inline;color:var(--ink)}
.detail{grid-column:1/-1;display:none;gap:16px;border-top:1px solid var(--line);padding-top:16px}
.detail.on{display:grid}
.detail .spec .row{padding:10px 0}
.detail .why{max-width:36em}
.empty{padding:40px;border:1px dashed var(--line);color:var(--stone)}
.terms{margin-top:56px;background:var(--white);border:1px solid var(--line);padding:32px}
.terms h3{font-size:22px;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:12px 18px;border-radius:var(--r);font-weight:600;font-size:14px;display:none;z-index:30}
.toast.on{display:block}
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a href="index.html" aria-label="LIVEWORK"><img class="mark" src="livework-wordmark-black.svg" alt="LIVE | WORK"></a>
  <span class="who" id="who"></span>
</div></header>

<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
/* demo: what Maria at Northwind sees. The live layer swaps this for the signed in contact's company. */
const LIVE = !!(window.LW && LW.anon && !/PASTE/.test(LW.anon));
const DEMO_ME = {name:'Maria Delgado', company:'Northwind Logistics', email:'maria@northwind.example', kind:'', fee:'', billing:'', guarantee:'', recruiter:'Derek Germann'};
let ME = LIVE ? {name:'', company:'', email:'', recruiter:'Derek Germann'} : DEMO_ME;
async function fn(name, body){
  const r = await fetch(`${LW.url}/functions/v1/${name}`, {method:'POST', headers:{'content-type':'application/json', apikey:LW.anon, Authorization:'Bearer '+LW.anon}, body:JSON.stringify(body)});
  return r.json().catch(()=>({ok:false}));
}
let TOK='';
async function pull(tok){
  if(!LIVE||!tok) return false;
  TOK=tok;
  const d = await fn('room-data',{token:tok});
  if(!d||!d.ok) return false;
  ME = {...ME, ...(d.contact||{}), ...(d.terms||{})};
  SEARCHES = (d.searches||[]).map(s=>({...s, cands:(s.cands||[]).map(c=>({...c, fit:c.fit||[]}))}));
  return true;
}
async function act(action, c, note){
  if(!LIVE) return true;
  const d = await fn('room-data',{token:TOK, action, pipeline_id:c.pipeline_id, note:note||''});
  if(!d||!d.ok){toast('That did not save. Try again.');return false}
  ME = {...ME, ...(d.contact||{}), ...(d.terms||{})};
  SEARCHES = (d.searches||[]).map(s=>({...s, cands:(s.cands||[]).map(c=>({...c, fit:c.fit||[]}))}));
  return true;
}
const SESSION_KEY='lw_room_session';
function saveSession(s){try{localStorage.setItem(SESSION_KEY, JSON.stringify(s))}catch(e){}}
function loadSession(){try{const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); if(s && new Date(s.expires_at)>new Date()) return s}catch(e){} return null}
function clearSession(){try{localStorage.removeItem(SESSION_KEY)}catch(e){}}
const STAGES=['Released','Interview','Offer','Placed'];
let SEARCHES=[
  {title:'Director of Fleet Operations', location:'Irvine, CA', comp:'$165k to $185k', opened:'Aug 14, 2026', status:'Open', cands:[
    {name:'Elena Vasquez', title:'Regional Operations Manager', location:'Orange County, CA', stage:1, why:'Ran a 60 truck fleet across three sites with full P&L. She is looking for a director seat and named Irvine as her preferred location. Available in 30 days.', fit:['Fleet operations, 9 years','Multi site leadership','P&L ownership','Available in 30 days'], feedback:'You advanced Elena on Aug 26. Interview set for Sep 9, 10:00 AM.', resume:'vasquez-resume.pdf'},
  ]},
  {title:'Warehouse Manager, Night Shift', location:'Santa Fe Springs, CA', comp:'$95k to $110k', opened:'Aug 20, 2026', status:'Open', cands:[
    {name:'Dana Whitfield', title:'Warehouse Manager', location:'Norwalk, CA', stage:0, why:'Runs a night operation today, 40 people. Open to a lateral move for a stronger culture, which is exactly what you described.', fit:['Night shift today','40 direct reports','WMS and RF scanning','12 minute commute'], feedback:'', resume:'whitfield-resume.pdf'},
  ]},
];
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}

let step=0, pendingEmail='', err='';
function door(){
  $('#who').textContent='';
  $('#main').innerHTML=`<section class="door"><div class="box">
    ${step===0?`<div class="hl"><span class="bar"></span><h1>Your room.</h1></div>
      <p>Sign in with the work email your recruiter invited. We send a six digit code, no password. Not a client yet? <a href="index.html#contact">Start a conversation</a>.</p>
      <div class="field"><label for="em">Work email</label><input id="em" type="email" placeholder="you@company.com" value="${esc(pendingEmail||(LIVE?'':ME.email))}"></div>
      ${err?`<p class="err">${esc(err)}</p>`:''}
      <button class="btn" id="go">Send my code</button>`
    :`<div class="hl"><span class="bar"></span><h1>Check your email.</h1></div>
      <p>If ${esc(pendingEmail)} was invited by your recruiter, a six digit code is on its way. Enter it here.</p>
      <p class="small">No code in a minute? Client room access is set up by your recruiter. Write to <a href="mailto:team@livework.inc">team@livework.inc</a> and we will open your room.</p>
      <div class="field"><label for="cd">Code</label><input id="cd" class="code" inputmode="numeric" maxlength="7" placeholder="000000"></div>
      ${err?`<p class="err">${esc(err)}</p>`:''}
      <button class="btn" id="go">Open my room</button>
      <p class="small"><a href="#" id="back">Use a different email</a></p>`}
  </div></section>`;
  const go=$('#go');
  go.onclick=async()=>{
    err='';
    if(step===0){
      pendingEmail=($('#em').value||'').trim().toLowerCase();
      if(!pendingEmail.includes('@')){err='Enter your work email.';return door()}
      if(LIVE){go.disabled=true;go.textContent='Sending';await fn('room-code',{email:pendingEmail})}
      step=1;door();$('#cd').focus();
    }else{
      const code=($('#cd').value||'').replace(/\D/g,'');
      if(code.length!==6){err='The code is six digits.';return door()}
      if(!LIVE){return room()}
      go.disabled=true;go.textContent='Opening';
      const r=await fn('room-verify',{email:pendingEmail,code});
      if(!r.ok){err={wrong:'That code did not match. Try again.',expired:'That code expired. Ask for a new one.',locked:'Too many tries. Ask for a new code.'}[r.reason]||'We could not sign you in. Check the email and try again.';return door()}
      saveSession(r);ME={...ME,...r.contact};SEARCHES=[];room();await pull(r.token||r.session_token||r.access_token);room();
    }
  };
  const em=$('#em');if(em)em.onkeydown=e=>{if(e.key==='Enter')go.click()};
  const cd=$('#cd');if(cd)cd.onkeydown=e=>{if(e.key==='Enter')go.click()};
  const b=$('#back');if(b)b.onclick=e=>{e.preventDefault();step=0;err='';door()};
}
function room(){
  $('#who').innerHTML=`<b>${esc(ME.name)}</b> · ${esc(ME.company)} &nbsp; <a href="#" id="out">Sign out</a>`;
  $('#out').onclick=e=>{e.preventDefault();clearSession();step=0;err='';door()};
  $('#main').innerHTML=`<section class="room"><div class="wrap">
    <div class="hl"><span class="bar"></span><h1>${esc(ME.company)}. ${SEARCHES.length?`${SEARCHES.length===1?'One search':SEARCHES.length+' searches'}, ${SEARCHES.reduce((n,s)=>n+s.cands.length,0)} to look at.`:'Nothing released yet.'}</h1></div>
    <p class="lede">${SEARCHES.length?`Everyone here has been screened by ${esc(ME.recruiter)} and released to you. Open a profile, then advance, pass, or ask for a time. You get an email as each search moves.`:`This is where your searches live. When ${esc(ME.recruiter)} releases a candidate you get an email, and they appear here with a profile, the fit, and three buttons: advance, ask for a time, pass.`}</p>
    ${SEARCHES.map((s,si)=>`<section class="srch">
      <header><div><h2>${esc(s.title)}</h2><p class="meta">${esc(s.location)} · ${esc(s.comp)} · opened ${s.opened}</p></div>
      <div class="ladder">${STAGES.map((k,i)=>`<span class="${s.cands.some(c=>c.stage>=i)?'on':''}">${k}</span>`).join('')}</div></header>
      <div class="cands">${s.cands.length?s.cands.map((c,ci)=>`<article class="cand" id="c${si}-${ci}">
        <div><b>${esc(c.name)}</b><span class="t">${esc(c.title)} · ${esc(c.location)}</span></div>
        <div class="stage ${c.stage>=3?'done':''}"><i></i>${STAGES[c.stage]}${c.stage===0?' to you':''}</div>
        <div class="acts"><button class="btn ghost" data-view="${si}-${ci}">Profile</button>${c.stage<2?`<button class="btn" data-adv="${si}-${ci}">Advance</button><button class="btn ghost" data-time="${si}-${ci}">Ask for a time</button><button class="btn ghost" data-pass="${si}-${ci}">Pass</button>`:''}</div>
        <div class="detail" id="d${si}-${ci}">
          <p class="why">${esc(c.why)}</p>
          <div class="spec">${c.fit.map(f=>`<div class="row"><b>Fit</b><span>${esc(f)}</span></div>`).join('')}<div class="row"><b>Resume</b><span>${c.resume_url?`<a href="${esc(c.resume_url)}" target="_blank" rel="noopener">${esc(c.resume)}</a>`:`<a href="#" data-noop>${esc(c.resume)}</a>`}</span></div></div>
        </div>
        ${c.feedback?`<div class="fb"><b>Your feedback.</b> ${esc(c.feedback)}</div>`:''}
      </article>`).join(''):`<div class="empty">Nothing released yet. You will get an email the moment there is someone to see.</div>`}</div>
    </section>`).join('')}
    ${ME.kind?`<div class="terms"><h3>Your engagement with LIVEWORK.</h3><div class="spec">
      <div class="row"><b>Engagement</b><span>${ME.kind} search</span></div>
      <div class="row"><b>Fee</b><span>${ME.fee}</span></div>
      <div class="row"><b>Billing</b><span>${ME.billing}</span></div>
      <div class="row"><b>Guarantee</b><span>${ME.guarantee} replacement on every placement</span></div>
      ${LIVE?`<div class="row"><b>Agreement</b><span><a href="engagement.html" target="_blank">Client engagement agreement</a></span></div>`:`<div class="row"><b>Agreement</b><span><a href="#" data-noop>Retained search agreement, signed Aug 12, 2026</a></span></div>`}
      <div class="row"><b>Your recruiter</b><span>${ME.recruiter} · <a href="mailto:team@livework.inc">team@livework.inc</a></span></div>
    </div></div>`:`<div class="terms"><h3>Your engagement with LIVEWORK.</h3><div class="spec"><div class="row"><b>Your recruiter</b><span>${ME.recruiter} · <a href="mailto:team@livework.inc">team@livework.inc</a></span></div></div></div>`}
  </div></section>`;
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const d=$('#d'+b.dataset.view);d.classList.toggle('on');b.textContent=d.classList.contains('on')?'Close':'Profile'});
  const get=k=>{const [si,ci]=k.split('-');return SEARCHES[si].cands[ci]};
  document.querySelectorAll('[data-adv]').forEach(b=>b.onclick=async()=>{const c=get(b.dataset.adv);b.disabled=true;if(!await act('advance',c))return room();if(!LIVE){c.stage=Math.max(c.stage,1);c.feedback=`You advanced ${c.name.split(' ')[0]} today. ${ME.recruiter} will reach out with times.`}toast(`Advanced. ${ME.recruiter} is on it.`);room()});
  document.querySelectorAll('[data-time]').forEach(b=>b.onclick=async()=>{const c=get(b.dataset.time);b.disabled=true;if(!await act('time',c))return room();if(!LIVE){c.feedback=`You asked for a time with ${c.name.split(' ')[0]}. ${ME.recruiter} will send options.`}toast('Asked. You will get times by email.');room()});
  document.querySelectorAll('[data-pass]').forEach(b=>b.onclick=async()=>{const k=b.dataset.pass;const [si,ci]=k.split('-');const c=get(k);const why=prompt(`Passing on ${c.name}. A line on why helps the next release.`,'');if(why===null)return;b.disabled=true;if(!await act('pass',c,why))return room();if(!LIVE){SEARCHES[si].cands.splice(ci,1)}toast('Passed. Noted for the next release.');room()});
  document.querySelectorAll('[data-noop]').forEach(a=>a.onclick=e=>{e.preventDefault();toast(LIVE?'Ask your recruiter for the file':'Files open with the live layer')});
  window.scrollTo(0,0);
}
const S0=LIVE?loadSession():null;
if(S0){ME={...ME,...S0.contact};SEARCHES=[];room();pull(S0.token||S0.session_token||S0.access_token).then(ok=>{if(ok)room()})}else door();
</script>
</body>
</html>
