<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F2ED">
<title>Candidates · LIVE|WORK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F2ED; --ink:#141210; --muted:#75716A; --faint:#9C988F;
  --line:#D3CEC4; --field:#E7E3DB; --chip:#E7E3DB; --btn:#FFFFFF;
  --yellow:#F2C632; --due:#8A6A22; --over:#B0342C;
}
[data-theme="dark"]{
  --paper:#15140F; --ink:#F4F2ED; --muted:#8F8B82; --faint:#6E6A62;
  --line:#2E2C26; --field:#211F1A; --chip:#211F1A; --btn:#1B1A15;
  --yellow:#F2C632; --due:#E0B94A; --over:#E27A70;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* top bar */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px;
  border-bottom:.5px solid var(--line);
  position:sticky;top:0;background:var(--paper);z-index:20;
}
.brand{font-size:15px;font-weight:600;letter-spacing:.2px}
.brand span{font-weight:500;color:var(--muted);margin-left:8px}
.themetog{display:flex;gap:2px;background:var(--field);border-radius:999px;padding:3px}
.themetog b{
  width:30px;height:26px;border-radius:999px;display:flex;align-items:center;
  justify-content:center;color:var(--muted);transition:background .18s ease;
}
.themetog b.on{background:var(--paper);color:var(--ink)}

/* head */
.wrap{padding:0 18px}
h1{font-size:44px;font-weight:800;letter-spacing:-2px;line-height:1;margin:22px 0 18px}
.pair{display:flex;gap:12px}
.pair button{
  flex:1;border:1px solid var(--line);background:var(--btn);border-radius:6px;
  padding:15px 0;font-size:15px;font-weight:500;
}
.pair button.solid{background:var(--yellow);border-color:var(--yellow);color:#141210}

.search{
  display:flex;align-items:center;gap:14px;
  border-bottom:.5px solid var(--line);margin-top:22px;padding-bottom:12px;
}
.search input{
  flex:1;border:none;background:none;font:inherit;font-size:16px;color:var(--ink);
  padding:0;min-width:0;
}
.search input::placeholder{color:var(--faint)}

.chips{display:flex;gap:9px;padding:14px 18px 0;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{
  border:1px solid var(--line);border-radius:6px;padding:8px 16px;font-size:14px;
  white-space:nowrap;background:var(--btn);
}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* rows */
.list{padding:0 18px}
.row{padding:22px 0;border-bottom:.5px solid var(--line)}
.rowtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.name{font-size:22px;font-weight:800;letter-spacing:-.6px;line-height:1.15}
.status{
  font-size:13px;background:var(--chip);color:var(--ink);
  padding:5px 13px;border-radius:999px;white-space:nowrap;margin-top:2px;
}
.meta{font-size:15px;color:var(--muted);margin-top:4px}
.touch{font-size:14px;color:var(--faint);margin-top:6px}
.acts{display:flex;gap:9px;margin-top:14px}
.acts a,.acts button{
  flex:1;border:1px solid var(--line);background:var(--btn);border-radius:6px;
  padding:13px 0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;
}
.follow{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;color:var(--due)}
.follow.over{color:var(--over)}
.follow.none{color:var(--faint)}
.empty{padding:48px 0;color:var(--muted);font-size:16px}

/* tabbar */
.tabs{
  position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--paper);
  border-top:.5px solid var(--line);padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:20;
}
.tabs a{flex:1;text-align:center;color:var(--muted);position:relative;padding-top:2px}
.tabs a.on{color:var(--ink)}
.tabs .lbl{font-size:11px;margin-top:3px;display:block}
.tabs .bar{height:2px;background:var(--yellow);margin:4px 22% 0;border-radius:2px}
.badge{
  position:absolute;top:-3px;left:calc(50% + 6px);background:var(--ink);color:var(--paper);
  font-size:10px;font-weight:600;min-width:17px;height:17px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}
svg{display:block;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">LIVE|WORK <span>Candidates</span></div>
  <div class="themetog" id="themetog" role="group" aria-label="Theme">
    <b class="on" data-set="light" role="button" tabindex="0" aria-label="Light">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
    </b>
    <b data-set="dark" role="button" tabindex="0" aria-label="Dark">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 14.2A8.2 8.2 0 1 1 9.8 4a6.6 6.6 0 0 0 10.2 10.2z"/></svg>
    </b>
  </div>
</div>

<div class="wrap">
  <h1>Candidates.</h1>
  <div class="pair">
    <button type="button" id="addBtn">Add candidate</button>
    <button type="button" class="solid" id="importBtn">Import résumés</button>
  </div>
  <div class="search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input id="q" type="search" placeholder="Name, title, location" aria-label="Search candidates">
  </div>
</div>

<div class="chips" id="chips"></div>
<div class="list" id="list"></div>

<nav class="tabs">
  <a href="today.html"><span style="position:relative;display:inline-block"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 10.5L12 4l8.5 6.5V20a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/></svg><i class="badge">1</i></span><span class="lbl">Today</span></a>
  <a href="clients.html"><span style="position:relative;display:inline-block"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3.5" width="12" height="17" rx="1"/><path d="M16 9h4v11.5M7.5 7.5h1.5M12 7.5h1.5M7.5 11.5h1.5M12 11.5h1.5M7.5 15.5h1.5M12 15.5h1.5"/></svg><i class="badge">2</i></span><span class="lbl">Clients</span></a>
  <a href="candidates.html" class="on" aria-current="page"><span style="position:relative;display:inline-block"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/></svg><i class="badge" id="tabCount">4</i></span><span class="lbl">Candidates</span><span class="bar"></span></a>
  <a href="pipeline.html"><span style="position:relative;display:inline-block"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="5" width="4.3" height="14" rx="1"/><rect x="9.8" y="5" width="4.3" height="10" rx="1"/><rect x="16.2" y="5" width="4.3" height="14" rx="1"/></svg><i class="badge">1</i></span><span class="lbl">Pipeline</span></a>
  <a href="more.html"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="margin:0 auto"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="lbl">More</span></a>
</nav>

<script>
/* ---------------------------------------------------------------
   DATA. Swap this array for your Supabase select and nothing else
   in this file has to change. Dates are ISO strings or null.
   --------------------------------------------------------------- */
let CANDIDATES = [
  { id:'c1', name:'Alex Loredo-Carreño', title:'Marketing Ambassador', location:'San Diego, CA',
    status:'New', track:'Construction', phone:'+16195550118', email:'alex@example.com',
    last_touch_at:null, follow_up_at:null, created_at:'2026-09-01' },
  { id:'c2', name:'Dmitry Shcherba', title:'Corporate Controller', location:'Orange County, CA',
    status:'New', track:'Finance', phone:'+17145550142', email:'dmitry@example.com',
    last_touch_at:null, follow_up_at:'2026-09-08', created_at:'2026-09-03' },
  { id:'c3', name:'Elena Vasquez', title:'Regional Operations Manager', location:'Orange County, CA',
    status:'Interviewing', track:'Construction', phone:'+19495550177', email:'elena@example.com',
    last_touch_at:'2026-09-05', follow_up_at:'2026-09-04', created_at:'2026-08-22' },
  { id:'c4', name:'Priya Raman', title:'Project Executive', location:'Los Angeles, CA',
    status:'Submitted', track:'Construction', phone:'+12135550163', email:'priya@example.com',
    last_touch_at:'2026-09-05', follow_up_at:'2026-09-15', created_at:'2026-08-14' },
  { id:'c5', name:'Marcus Bell', title:'Assistant Controller', location:'Irvine, CA',
    status:'New', track:'Finance', phone:'+19495550190', email:'marcus@example.com',
    last_touch_at:null, follow_up_at:'2026-09-07', created_at:'2026-09-05' }
];

const TRACKS = ['All','Finance','Construction'];
let track = 'All', query = '';

/* ---------------- dates ---------------- */
const DAY = 86400000;
const midnight = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const today = midnight(new Date());
const days = iso => Math.round((midnight(iso) - today) / DAY);

function followText(c){
  if (!c.follow_up_at) return { text:'No contact yet', cls:'none' };
  const d = days(c.follow_up_at);
  if (d < -1) return { text:'Overdue ' + Math.abs(d) + ' days', cls:'over' };
  if (d === -1) return { text:'Overdue since yesterday', cls:'over' };
  if (d === 0) return { text:'Follow up today', cls:'' };
  if (d === 1) return { text:'Follow up tomorrow', cls:'' };
  if (d <= 6) return { text:'Follow up ' + new Date(c.follow_up_at).toLocaleDateString(undefined,{weekday:'long'}), cls:'' };
  return { text:'Follow up ' + new Date(c.follow_up_at).toLocaleDateString(undefined,{month:'short',day:'numeric'}), cls:'' };
}

function touchText(c){
  if (!c.last_touch_at) return 'No contact yet';
  const d = -days(c.last_touch_at);
  if (d <= 0) return 'Last contacted today';
  if (d === 1) return 'Last contacted yesterday';
  return 'Last contacted ' + d + ' days ago';
}

/* Sort: overdue first, then soonest follow up, then never contacted
   by longest in the pool, then everyone else. */
function rank(c){
  if (c.follow_up_at) return days(c.follow_up_at);
  if (!c.last_touch_at) return 900 + days(c.created_at);
  return 9000 - days(c.last_touch_at);
}

/* ---------------- render ---------------- */
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

const ICON = {
  phone:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.2 3.5h3l1.5 4-2 1.4a12 12 0 0 0 6.4 6.4l1.4-2 4 1.5v3a2 2 0 0 1-2.2 2A16.8 16.8 0 0 1 4.2 5.7a2 2 0 0 1 2-2.2z"/></svg>',
  mail:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.6 6.6L12 12.6l8.4-6"/></svg>',
  open:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h15M13.5 6.5L20 12l-6.5 5.5"/></svg>',
  clock:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.3V12l3.2 2"/></svg>'
};

function chips(){
  document.getElementById('chips').innerHTML = TRACKS.map(t =>
    `<button type="button" data-track="${t}" aria-pressed="${t===track}">${t}</button>`).join('');
}

function render(){
  const q = query.trim().toLowerCase();
  const rows = CANDIDATES
    .filter(c => track === 'All' || c.track === track)
    .filter(c => !q || (c.name+' '+c.title+' '+c.location).toLowerCase().includes(q))
    .sort((a,b) => rank(a) - rank(b));

  document.getElementById('tabCount').textContent =
    CANDIDATES.filter(c => c.follow_up_at && days(c.follow_up_at) <= 0).length;

  if (!rows.length){
    document.getElementById('list').innerHTML =
      '<p class="empty">No one here yet. Add a candidate or import a résumé to start.</p>';
    return;
  }

  document.getElementById('list').innerHTML = rows.map(c => {
    const f = followText(c);
    return `<article class="row">
      <div class="rowtop">
        <h2 class="name">${esc(c.name)}</h2>
        <span class="status">${esc(c.status)}</span>
      </div>
      <p class="meta">${esc(c.title)} &middot; ${esc(c.location)}</p>
      <p class="touch">${touchText(c)}</p>
      <div class="acts">
        <a href="tel:${esc(c.phone)}" data-log="call" data-id="${c.id}">${ICON.phone}Call</a>
        <a href="mailto:${esc(c.email)}" data-log="email" data-id="${c.id}">${ICON.mail}Email</a>
        <a href="candidate.html?id=${encodeURIComponent(c.id)}">${ICON.open}Open</a>
      </div>
      <p class="follow ${f.cls}">${ICON.clock}${f.text}</p>
    </article>`;
  }).join('');
}

/* ---------------- logging on press ----------------
   Pressing Call or Email writes the activity itself so the
   last contacted line stays true with nobody typing.
   Point logTouch at your activity insert and it is wired. */
async function logTouch(id, channel){
  const c = CANDIDATES.find(x => x.id === id);
  if (!c) return;
  c.last_touch_at = new Date().toISOString().slice(0,10);
  render();
  try {
    if (window.LW && window.LW.logTouch) await window.LW.logTouch({ candidate_id:id, channel });
  } catch(e){ console.warn('touch not saved', e); }
}

/* ---------------- events ---------------- */
document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('[data-track]'); if (!b) return;
  track = b.dataset.track; chips(); render();
});
document.getElementById('q').addEventListener('input', e => { query = e.target.value; render(); });
document.getElementById('list').addEventListener('click', e => {
  const a = e.target.closest('[data-log]'); if (!a) return;
  logTouch(a.dataset.id, a.dataset.log);
});
document.getElementById('themetog').addEventListener('click', e => {
  const b = e.target.closest('[data-set]'); if (!b) return;
  document.documentElement.dataset.theme = b.dataset.set;
  document.querySelector('meta[name=theme-color]').content = b.dataset.set === 'dark' ? '#15140F' : '#F4F2ED';
  document.querySelectorAll('#themetog b').forEach(x => x.classList.toggle('on', x === b));
});
document.getElementById('addBtn').addEventListener('click', () => location.href = 'candidate.html?new=1');
document.getElementById('importBtn').addEventListener('click', () => location.href = 'import.html');

chips(); render();
</script>
</body>
</html>
