/* rehydrate an unfinished tray from the queue table */
function intakeRestore(){
  if(INTAKE.length) return;
  let rows = (S.intake_queue || []).filter(r => ['pending','reading','read','error'].indexOf(String(F(r,'status'))) >= 0);
  if(!rows.length) return;
  const when = r => String(F(r,'created_at') || '');
  rows.sort((a,b) => when(a) < when(b) ? -1 : when(a) > when(b) ? 1 : 0);
  /* one tray at a time. the newest unfinished batch comes back, older orphans stay in the table. */
  const newest = F(rows[rows.length - 1], 'batch_id');
  rows = rows.filter(r => String(F(r,'batch_id')) === String(newest));
  for(const r of rows){
    const p = r.parsed || null;
    INTAKE.push({ qid: idOf(r), file: F(r,'filename') || 'Resume', blob: null, path: F(r,'path'),
      hash: F(r,'file_hash') || '', parsed: p, source: p ? (p.source || 'model') : '',
      fields: p ? fieldsFrom(p) : null, existing: p ? matchExisting(p) : null,
      maybe: p ? matchMaybe(p) : null, same: false,
      status: p ? 'ready' : (String(F(r,'status')) === 'error' ? 'error' : 'held'),
      error: F(r,'error') || '' });
  }
  if(rows.length){
    const r0 = rows[rows.length - 1];
    BATCH = { id: F(r0,'batch_id') || null, company_id: r0.company_id || '', search_id: r0.search_id || '',
      source: F(r0,'source') || '', role_type: F(r0,'role_type') || '', campaign: F(r0,'campaign') || '' };
  }
}
function fieldsFrom(p){
  return { name: p.name || '', title: p.title || '', email: String(p.email || '').toLowerCase(),
    phone: p.phone || '', location: p.location || '', summary: p.summary || '', industry: '' };
}
function matchExisting(p){
  const em = String(p.email || '').toLowerCase();
  if(em){ const c = S.candidates.find(c => String(F(c,'email')||'').toLowerCase() === em); if(c) return c; }
  const ph = digits(p.phone);
  if(ph.length >= 10 && p.name){
    const c = S.candidates.find(c => norm(F(c,'name')) === norm(p.name) && digits(F(c,'phone')).slice(-10) === ph.slice(-10));
    if(c) return c;
  }
  return null;
}
/* a name on its own is never enough to merge. flag it and let a person decide. */
function matchMaybe(p){
  if(!p.name || matchExisting(p)) return null;
  return S.candidates.find(c => norm(F(c,'name')) === norm(p.name)) || null;
}

async function intakeAdd(files){
  const list = Array.from(files || []).filter(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name));
  if(!list.length) return toast('PDF only for now.', true);
  const room = INTAKE_CAP - INTAKE.filter(x => x.status !== 'saved' && x.status !== 'skipped').length;
  if(list.length > room) toast('A hundred at a time. Taking the first ' + room + '.', true);
  const take = list.slice(0, Math.max(0, room));
  if(!take.length) return;
  batchId();
  let dupFile = 0, dupOld = 0;
  for(const f of take){
    const x = { file: f.name, blob: f, status: 'uploading', fields: null, hash: '' };
    INTAKE.push(x); draw();
    x.hash = await hashFile(f);
    const twice = x.hash && INTAKE.some(y => y !== x && y.hash === x.hash);
    const old = x.hash && S.candidates.find(c => F(c,'file_hash') === x.hash);
    if(twice || old){
      x.status = 'skipped';
      x.note = twice ? 'Same file twice in this drop' : 'Same file already imported for ' + pname(idOf(old));
      twice ? dupFile++ : dupOld++;
      draw(); continue;
    }
    try{
      await alive();
      const safe = f.name.replace(/[^A-Za-z0-9._-]+/g, '-').slice(0, 60);
      const path = 'originals/' + Date.now() + '-' + Math.random().toString(36).slice(2,6) + '-' + safe;
      const up = await fetch(LW.url + '/storage/v1/object/resumes/' + path, { method:'POST',
        headers:{ apikey: LW.anon, Authorization:'Bearer ' + LWAuth.token(), 'content-type':'application/pdf', 'x-upsert':'true' }, body: f });
      if(!up.ok) throw new Error('upload refused. ' + (await up.text()).slice(0, 120));
      x.path = path;
      const q = await insert('intake_queue', Object.assign({ filename: f.name, path: path, file_hash: x.hash, status: 'pending' }, stampRow()));
      x.qid = idOf(q);
      x.status = 'held';
    }catch(err){ x.status = 'error'; x.error = 'Upload failed. ' + err.message; console.error(err); }
    draw();
  }
  if(dupFile || dupOld) toast((dupFile + dupOld) + ' skipped as duplicates.');
}

async function intakeRead(x){
  try{
    if(!x.path) throw new Error('no file on the server');
    await queueWrite(x, { status: 'reading' });
    const j = await Promise.race([fnCall('resume-read', { path: x.path }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('No answer from the reader in two minutes.')), 120000))]);
    const p = j.parsed || {};
    x.parsed = p; x.source = p.source || 'model';
    x.fields = fieldsFrom(p);
    x.existing = matchExisting(p);
    x.maybe = matchMaybe(p);
    x.status = 'ready';
    await queueWrite(x, { status: 'read', parsed: p, read_at: new Date().toISOString(), error: null });
  }catch(err){
    x.status = 'error'; x.error = err.message; console.error(err);
    await queueWrite(x, { status: 'error', error: String(err.message).slice(0, 300) });
  }
  if(VIEW === 'intake') draw();
}
let INTAKE_BUSY = false;
async function intakeReadAll(){
  if(INTAKE_BUSY) return;
  INTAKE_BUSY = true;
  try{
    for(;;){
      const x = INTAKE.find(y => y.status === 'held');
      if(!x) break;
      x.status = 'reading'; if(VIEW === 'intake') draw();
      await intakeRead(x);
    }
  } finally { INTAKE_BUSY = false; if(VIEW === 'intake') draw(); }
}
async function intakeTag(cid, industry){
  if(!industry) return;
  let tag = S.tags.find(t => String(F(t,'name','label')).toLowerCase() === industry.toLowerCase());
  if(!tag){ tag = await insert('tags', { name: industry, kind: 'industry' }); S.tags.push(tag); }
  const dup = S.candidate_tags.find(t => String(t.candidate_id) === String(cid) && String(t.tag_id) === String(idOf(tag)));
  if(!dup) await insert('candidate_tags', { candidate_id: cid, tag_id: idOf(tag) });
}
/* a reapply never overwrites what a recruiter typed. blanks only, plus a new document and a line on the file. */
function fillBlanks(existing, f, x){
  const want = { name: f.name, title: f.title, email: f.email, phone: f.phone, location: f.location,
    summary: f.summary, linkedin: (x.parsed || {}).linkedin || '' };
  const row = {};
  for(const k in want){ if(want[k] && !F(existing, k)) row[k] = want[k]; }
  if(!F(existing,'profile_json') && x.parsed) row.profile_json = { tags: x.parsed.tags || [], sections: x.parsed.sections || [] };
  if(!F(existing,'role_type') && BATCH.role_type) row.role_type = BATCH.role_type;
  return row;
}
async function intakeSaveAll(){
  const todo = INTAKE.filter(x => x.status === 'ready');
  const bad = todo.filter(x => !x.fields.name);
  if(bad.length) return toast(bad.length + ' still need a name.', true);
  /* same email twice inside one batch collapses to the first card */
  const seen = {};
  for(const x of todo){
    const em = String(x.fields.email || '').toLowerCase();
    if(!em) continue;
    if(seen[em]){ x.status = 'skipped'; x.note = 'Same email as ' + (seen[em].fields.name || 'another card') + ' in this batch';
      await queueWrite(x, { status: 'skipped' }); }
    else seen[em] = x;
  }
  const live = todo.filter(x => x.status === 'ready');
  const noInd = live.filter(x => !x.fields.industry);
  if(noInd.length && !confirm(noInd.length + ' have no industry tag. Save anyway?')) return;
  const b = $('#isaveall'); if(b){ b.disabled = true; b.textContent = 'Saving'; }
  let ok = 0;
  for(const x of live){
    const f = x.fields;
    const target = x.existing || (x.same ? x.maybe : null);
    try{
      let c;
      if(target){
        const row = fillBlanks(target, f, x);
        c = Object.keys(row).length ? await patch('candidates', idOf(target), row) : target;
        await insert('documents', clean({ candidate_id: idOf(c), kind: 'resume', title: x.file, storage_path: x.path }));
        await insert('activity', clean({ type: 'note', title: 'Reapplied', candidate_id: idOf(c),
          body: 'New resume received' + (BATCH.campaign ? ' · ' + BATCH.campaign : '') + (BATCH.source ? ' · ' + BATCH.source : ''),
          occurred_at: new Date().toISOString() }));
        x.ref = F(c,'reference_code','ref_code') || 'updated';
      }else{
        const row = clean({ name: f.name, title: f.title, email: f.email, phone: f.phone, location: f.location,
          summary: f.summary, linkedin: (x.parsed || {}).linkedin || undefined,
          resume_path: x.path, resume_read_at: new Date().toISOString(), file_hash: x.hash || undefined,
          profile_json: { tags: (x.parsed || {}).tags || [], sections: (x.parsed || {}).sections || [] },
          source: BATCH.source || 'intake', source_company_id: BATCH.company_id || undefined,
          source_search_id: BATCH.search_id || undefined, role_type: BATCH.role_type || undefined,
          campaign: BATCH.campaign || undefined });
        c = await insert('candidates', row);
        try{ const pj = await fnCall('profile-pdf', { candidate_id: idOf(c) }); x.ref = pj.ref; }
        catch(e){ x.ref = 'no PDF: ' + e.message; }
      }
      await intakeTag(idOf(c), f.industry);
      x.status = 'saved'; ok++;
      await queueWrite(x, { status: 'saved', candidate_id: idOf(c), saved_at: new Date().toISOString() });
    }catch(err){ x.status = 'error'; x.error = 'Did not save. ' + err.message;
      await queueWrite(x, { status: 'error', error: String(err.message).slice(0, 300) }); }
    draw();
  }
  await loadAll(); drawNav(); draw();
  toast(ok + ' of ' + live.length + ' saved.');
}
/* ---------- Invoices ---------- */
/* the ladder. days is negative before the due date, positive after. */
function invDays(i){ const d = F(i,'due_at','due_on'); if(!d) return null;
  return Math.round((Date.now() - new Date(d).getTime()) / 86400000); }
function sendKind(i){
  if(!F(i,'sent_at')) return 'send';
  const d = invDays(i);
  if(d === null) return 'courtesy';
  if(d >= 30) return 'final';
  if(d >= 1) return 'past';
  if(d === 0) return 'due';
  return 'courtesy';
}
function sendLabel(i){
  const k = sendKind(i);
  return k === 'send' ? 'Send' : k === 'final' ? 'Final notice' : k === 'past' ? 'Chase' : 'Remind';
}
/* what the desk thinks needs doing today, invoice side */
function invDue(){
  return S.invoices.filter(i => {
    if(String(F(i,'status')).toLowerCase() === 'paid') return false;
    if(!F(i,'sent_at')) return true;
    const d = invDays(i); if(d === null) return false;
    const stage = num(F(i,'reminder_stage'));
    if(d >= 30) return stage < 4;
    if(d >= 15) return stage < 3;
    if(d >= 7)  return stage < 2;
    if(d >= 0)  return stage < 1;
    return d >= -7 && stage < 1;
  });
}

function vInvoices(){
  const age = i => {
    if(String(F(i,'status')).toLowerCase() === 'paid') return 'Paid';
    const d = F(i,'due_at') ? daysBetween(F(i,'due_at')) : 0;
    if(!F(i,'due_at')) return 'No due date';
    return new Date(F(i,'due_at')) < new Date() ? d + ' days past due' : 'Due in ' + daysBetween(new Date(), F(i,'due_at')) + ' days';
  };
  const out = S.invoices.filter(i => String(F(i,'status')).toLowerCase() !== 'paid');
  return head('Invoices.', '<button class="btn pill" data-new="invoice"><span class="p">+</span>Raise an invoice</button>') +
    '<div class="stats">' +
      '<div class="stat"><b>' + money(out.reduce((n,i) => n + num(F(i,'amount')), 0)) + '</b><span>Outstanding</span></div>' +
      '<div class="stat y"><b>' + money(S.invoices.filter(i => String(F(i,'status')).toLowerCase()==='paid').reduce((n,i) => n + num(F(i,'amount')), 0)) + '</b><span>Collected</span></div>' +
      '<div class="stat"><b>' + out.filter(i => F(i,'due_at') && new Date(F(i,'due_at')) < new Date()).length + '</b><span>Past due</span></div>' +
      '<div class="stat"><b>20%</b><span>Placement fee, net thirty</span></div>' +
    '</div>' +
    table(['Invoice','Client','Amount','Aging','Status','Billing'],
      S.invoices.map(i => '<div class="r" style="grid-template-columns:130px 1.4fr 130px 1fr 120px 210px" data-inv="' + idOf(i) + '">' +
        '<b>' + esc(F(i,'invoice_no','number') || 'Draft') + '</b>' +
        '<span class="muted">' + esc(cname(i.company_id)) + '</span>' +
        '<span>' + money(F(i,'amount')) + '</span>' +
        '<span class="muted small">' + age(i) + '</span>' +
        '<span class="st ' + esc(String(F(i,'status')||'').toLowerCase()) + '">' + esc(F(i,'status') || 'Draft') + '</span>' +
        '<span style="display:flex;gap:6px;flex-wrap:wrap">' +
          '<button class="btn sm ghost" data-pdf="' + idOf(i) + '">PDF</button>' +
          (String(F(i,'status')).toLowerCase() === 'paid' ? '' :
            '<button class="btn sm ghost" data-send="' + idOf(i) + '" data-kind="' + sendKind(i) + '">' + sendLabel(i) + '</button>' +
            '<button class="btn sm ghost" data-paid="' + idOf(i) + '">Paid</button>') +
        '</span></div>'),
      '130px 1.4fr 130px 1fr 120px 210px') +
    '<p class="muted small" style="margin-top:16px">Invoices are issued by GERMANN INC dba LIVEWORK. Numbering runs from 1001.</p>';
}

/* ---------- Mail ---------- */
function vMail(){
  const on = k => { const a = S.automations.filter(x => x.trigger === k || x.name === k)[0]; return a && a[MAP.automation.enabled] === true; };
  return head('Mail.', '') +
    '<div class="sec"><h2>Automations.</h2><span class="muted small">Every send is logged below</span></div>' +
    '<div class="auto">' + AUTOS.map(([k,l,d]) =>
      '<div class="toggle"><div><b>' + l + '</b><small>' + d + '</small></div>' +
      '<button class="sw ' + (on(k)?'on':'') + '" data-auto="' + k + '" aria-label="' + l + '"></button></div>').join('') + '</div>' +
    '<div class="sec"><h2>Outbound.</h2></div>' +
    table(['Sent','To','Subject','Source','Status'],
      [...S.outbound].sort((a,b) => String(b.created_at||'').localeCompare(String(a.created_at||''))).slice(0,80)
      .map(o => '<div class="r" style="grid-template-columns:140px 1.4fr 2fr 140px 110px">' +
        '<span class="muted small">' + short(o.created_at) + '</span>' +
        '<span>' + esc(F(o,'to_name') ? F(o,'to_name') + ' · ' + F(o,'to_email') : F(o,'to_email')) + '</span>' +
        '<span class="muted">' + esc(F(o,'subject')) + '</span>' +
        '<span class="muted small">' + esc(F(o,'sent_by','source')) + '</span>' +
        '<span class="st ' + esc(String(F(o,'status')||'').toLowerCase()) + '">' + esc(F(o,'status') || 'queued') + '</span></div>'),
      '140px 1.4fr 2fr 140px 110px');
}

/* ---------- Reports ---------- */
function vReports(){
  const total = S.pipeline.length || 1;
  const funnel = STAGES.slice(0,5).map(st => {
    const n = S.pipeline.filter(p => stageIx(p) >= STAGES.indexOf(st) && stageOf(p) !== 'Passed').length;
    return '<div class="barrow"><span>' + st + '</span><span class="t"><i class="' + (st==='Placed'?'y':'') + '" style="width:' + Math.round(n/total*100) + '%"></i></span><span>' + n + '</span></div>';
  }).join('');
  const perCo = S.companies.map(c => {
    const ss = S.searches.filter(s => String(s.company_id)===String(idOf(c)));
    const filled = ss.filter(s => !isOpen(s)).length;
    return { name: F(c,'name'), n: ss.length, filled, pct: ss.length ? Math.round(filled/ss.length*100) : 0 };
  }).filter(x => x.n).sort((a,b) => b.pct - a.pct);
  const team = S.staff.map(st => {
    const acts = S.activity.filter(a => String(a.staff_id)===String(idOf(st)));
    return { name: F(st,'name','email'), calls: acts.filter(a => /call/i.test(F(a,'kind'))).length,
      visits: acts.filter(a => /visit/i.test(F(a,'kind'))).length,
      notes: S.interview_notes.filter(n => String(n.staff_id)===String(idOf(st))).length,
      placed: S.placements.filter(p => String(F(p,'staff_id','owner_id'))===String(idOf(st))).length };
  });
  return head('Reports.', '') +
    '<div class="sec"><h2>Funnel.</h2></div><div class="bars">' + funnel + '</div>' +
    '<div class="sec"><h2>Fill rate by client.</h2></div>' +
    table(['Client','Searches','Filled','Rate'],
      perCo.map(x => '<div class="r" style="grid-template-columns:2fr 120px 120px 1fr">' +
        '<b>' + esc(x.name) + '</b><span>' + x.n + '</span><span>' + x.filled + '</span>' +
        '<div><span class="muted small">' + x.pct + '%</span><div class="gbar"><i style="width:' + x.pct + '%"></i></div></div></div>'),
      '2fr 120px 120px 1fr') +
    '<div class="sec"><h2>Team scorecard.</h2></div>' +
    table(['Person','Calls','Visits','Interview notes','Placements'],
      team.map(t => '<div class="r" style="grid-template-columns:2fr 100px 100px 150px 120px">' +
        '<b>' + esc(t.name) + '</b><span>' + t.calls + '</span><span>' + t.visits + '</span><span>' + t.notes + '</span><span>' + t.placed + '</span></div>'),
      '2fr 100px 100px 150px 120px');
}

/* ---------- Settings ---------- */
function vSettings(){
  const srcs = S.import_sources.length ? S.import_sources :
    [{name:'Indeed', status:'Key not set'},{name:'LinkedIn', status:'Key not set'}];
  return head('Settings.', '') +
    '<div class="sec"><h2>Roles.</h2></div>' +
    table(['Person','Email','Role'],
      S.staff.map(s => '<div class="r" style="grid-template-columns:1.4fr 1.8fr 140px">' +
        '<b>' + esc(F(s,'name','email')) + '</b><span class="muted">' + esc(F(s,'email')) + '</span>' +
        '<span class="chip">' + esc(F(s,'role') || 'staff') + '</span></div>'),
      '1.4fr 1.8fr 140px') +
    '<div class="sec"><h2>Import sources.</h2><span class="muted small">Keys land here when the accounts are open</span></div>' +
    table(['Source','Status'],
      srcs.map(s => '<div class="r" style="grid-template-columns:1fr 2fr">' +
        '<b>' + esc(F(s,'name')) + '</b><span class="muted">' + esc(F(s,'status') || 'Key not set') + '</span></div>'),
      '1fr 2fr') +
    '<div class="sec"><h2>Promised terms.</h2></div>' +
    '<div class="spec" style="background:var(--white);border:1px solid var(--line);padding:0 20px">' +
      '<div class="row"><b>Placement fee</b><span>20% of first year base salary, contingent</span></div>' +
      '<div class="row"><b>Retained search</b><span>$10,000 deposit up front, credited against the fee</span></div>' +
      '<div class="row"><b>Guarantee</b><span>90 day replacement search on every placement</span></div>' +
      '<div class="row"><b>Billing entity</b><span>GERMANN INC dba LIVEWORK, on invoices only</span></div>' +
      '<div class="row"><b>Terms</b><span><a href="engagement.html">Client engagement agreement</a></span></div>' +
    '</div>';
}
</script>

<script>
/* ============================ sheets ============================ */
let SHEET = { kind:null, id:null, tab:0 };
function closeSheet(){ $('#sheet').classList.remove('on'); $('#veil').classList.remove('on'); SHEET = { kind:null, id:null, tab:0 }; }
function openSheet(kind, id, tab){ SHEET = { kind, id, tab: tab || 0 }; paintSheet(); }
function shell(title, sub, body){
  $('#sheet').innerHTML = '<button class="x" id="sx">Close</button>' +
    '<div><h2>' + title + '</h2>' + (sub ? '<p class="sub">' + sub + '</p>' : '') + '</div>' + body;
  $('#sheet').classList.add('on'); $('#veil').classList.add('on');
  $('#sx').onclick = closeSheet;
  wireSheet();
  labelCells($('#sheet'));
}
function tabs(names){
  return '<div class="tabs">' + names.map((n,i) => '<button data-tab="' + i + '" class="' + (SHEET.tab===i?'on':'') + '">' + n + '</button>').join('') + '</div>';
}
function spec(rows){
  return '<div class="spec">' + rows.filter(Boolean).map(([k,v]) => '<div class="row"><b>' + k + '</b><span>' + (v==null||v===''?'<span class="muted">Not set</span>':v) + '</span></div>').join('') + '</div>';
}
function logList(items){
  return items.length ? '<div class="log">' + items.map(([w,t]) => '<div class="e"><span>' + w + '</span><span>' + t + '</span></div>').join('') + '</div>'
    : '<p class="muted small">Nothing logged yet.</p>';
}
function paintSheet(){
  const k = SHEET.kind;
  if(k === 'company') return sheetCompany();
  if(k === 'search') return sheetSearch();
  if(k === 'candidate') return sheetCandidate();
  if(k === 'pool') return sheetPool();
  if(k === 'form') return;
}
function sheetCompany(){
  const c = company(SHEET.id); if(!c) return closeSheet();
  const ss = S.searches.filter(s => String(s.company_id)===String(idOf(c)));
  const ids = ss.map(s => String(idOf(s)));
  const acts = S.activity.filter(a => String(a.company_id)===String(idOf(c)) || ids.includes(String(a.search_id)));
  const inv = S.invoices.filter(i => String(i.company_id)===String(idOf(c)));
  const pl = S.placements.filter(p => String(p.company_id)===String(idOf(c)));
  const docs = S.documents.filter(d => String(d.company_id)===String(idOf(c)));
  const T = SHEET.tab;
  let body = '';
  if(T===0) body = spec([
      ['Status', esc(F(c,'status') || 'Active')],
      ['Engagement', esc(F(c,'kind','engagement') || 'Contingent')],
      ['Location', esc(F(c,'city','location'))],
      ['Industry', esc(F(c,'industry'))],
      ['Fee', esc(F(c,'fee','fee_pct') || '20% of first year base')],
      ['Guarantee', '90 days'],
      ['Owner', esc(ownerName(F(c,'owner_id')))],
      ['Notes', esc(F(c,'notes','bio'))]
    ]) + '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" data-edit="company:' + idOf(c) + '">Edit</button><button class="btn ghost" data-mail="co:' + idOf(c) + '">Email</button><button class="btn ghost" data-new="visit" data-co="' + idOf(c) + '">Visit note</button><button class="btn ghost" data-new="search" data-co="' + idOf(c) + '">Open a search</button></div>';
  if(T===1) body = contactsOf(idOf(c)).map(ct =>
      '<div class="toggle"><div><b>' + esc(F(ct,'name')) + '</b><small>' + esc(F(ct,'title')) + ' · ' + esc(F(ct,'email')) + (F(ct,'phone') ? ' · <a href="tel:' + esc(String(F(ct,'phone')).replace(/[^0-9+]/g,'')) + '">' + esc(F(ct,'phone')) + '</a>' : '') + '</small></div>' +
      '<div style="display:flex;gap:16px;align-items:center">' +
        '<span class="muted small">Room</span><button class="sw ' + (ct[MAP.contact.room]===true?'on':'') + '" data-room="' + idOf(ct) + '" aria-label="Client room access"></button>' +
        '<span class="muted small">Billing</span><button class="sw ' + (ct[MAP.contact.billing]===true?'on':'') + '" data-bill="' + idOf(ct) + '" aria-label="Billing contact"></button>' +
        (F(ct,'email') ? '<button class="btn sm ghost" data-mail="ct:' + idOf(ct) + '">Email</button>' : '') +
        '<button class="btn sm ghost" data-edit="contact:' + idOf(ct) + '">Edit</button>' +
      '</div></div>').join('') +
      '<p class="muted small">Room lets them sign in at the client room with a code. Billing sends invoices and payment reminders to them. One billing contact per client.</p>' +
      '<button class="btn" data-new="contact" data-co="' + idOf(c) + '">Add a contact</button>';
  if(T===2) body = (ss.length ? ss.map(s => '<div class="toggle"><div><b>' + esc(F(s,'title','role')) + '</b><small>' + esc(F(s,'location')) + ' · ' + (isOpen(s)?'Open':'Closed') + '</small></div><button class="btn sm ghost" data-se="' + idOf(s) + '">Open</button></div>').join('') : '<p class="muted small">No searches yet.</p>') +
      '<button class="btn" data-new="search" data-co="' + idOf(c) + '">Open a search</button>';
  if(T===3) body = logList(acts.sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))).slice(0,40)
      .map(a => [short(a.created_at) + ' ' + esc(F(a,'kind')), esc(F(a,'body','note'))]));
  if(T===4) body = spec([
      ['Placements', pl.length],
      ['Fees billed', money(inv.reduce((n,i) => n + num(F(i,'amount')), 0))],
      ['Outstanding', money(inv.filter(i => String(F(i,'status')).toLowerCase()!=='paid').reduce((n,i) => n + num(F(i,'amount')), 0))]
    ]) + (inv.length ? logList(inv.map(i => [esc(F(i,'invoice_no','number') || 'Draft'), money(F(i,'amount')) + ' · ' + esc(F(i,'status') || 'draft')])) : '') +
    '<button class="btn ghost" data-new="invoice" data-co="' + idOf(c) + '">Raise an invoice</button>';
  if(T===5) body = (docs.length ? logList(docs.map(d => [short(d.created_at), esc(F(d,'name','title','kind'))]))
      : '<p class="muted small">No documents on file. Signed agreements and search orders land here.</p>');
  shell(esc(F(c,'name')) + '.', esc(F(c,'city','location','industry')),
    tabs(['Profile','Contacts','Searches','Activity','Money','Documents']) + body);
}
function sheetSearch(){
  const s = search(SHEET.id); if(!s) return closeSheet();
  const rows = S.pipeline.filter(p => String(p.search_id)===String(idOf(s)));
  const acts = S.activity.filter(a => String(a.search_id)===String(idOf(s)));
  const T = SHEET.tab;
  let body = '';
  if(T===0) body = spec([
      ['Client', esc(cname(s.company_id))],
      ['Status', isOpen(s) ? 'Open' : 'Closed'],
      ['Engagement', esc(F(s,'kind','engagement') || 'Contingent')],
      ['Location', esc(F(s,'location'))],
      ['Compensation', [money(F(s,'comp_min')), money(F(s,'comp_max'))].filter(Boolean).join(' to ') || esc(F(s,'comp'))],
      ['Opened', day(F(s,'opened_at','created_at'))],
      ['Days open', daysBetween(F(s,'opened_at','created_at'))],
      ['Fee', esc(F(s,'fee') || '20% of first year base')],
      ['The brief', esc(F(s,'notes','brief','description'))]
    ]) + '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" data-new="pipeline" data-se="' + idOf(s) + '">Submit a candidate</button>' +
      '<button class="btn ghost" data-edit="search:' + idOf(s) + '">Edit</button>' +
      '<button class="btn ghost" data-close="' + idOf(s) + '">' + (isOpen(s)?'Close the search':'Reopen') + '</button></div>';
  if(T===1) body = (rows.length ? rows.map(p => '<div class="toggle"><div><b>' + esc(pname(p.candidate_id)) + '</b><small>' + stageOf(p) + ' · ' + (isReleased(p)?'released':'held') + '</small></div>' +
      '<div style="display:flex;gap:6px"><button class="btn sm ghost" data-adv="' + idOf(p) + '">Advance</button><button class="btn sm ghost" data-rel="' + idOf(p) + '">' + (isReleased(p)?'Hold':'Release') + '</button></div></div>').join('')
      : '<p class="muted small">Nobody submitted yet.</p>') + '<button class="btn" data-new="pipeline" data-se="' + idOf(s) + '">Submit a candidate</button>';
  if(T===2) body = logList(acts.sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))).slice(0,40)
      .map(a => [short(a.created_at) + ' ' + esc(F(a,'kind')), esc(F(a,'body','note'))]));
  shell(esc(F(s,'title','role')) + '.', esc(cname(s.company_id)) + ' · ' + esc(F(s,'location')),
    tabs(['Job order','Pipeline','Activity']) + body);
}
function sheetCandidate(){
  const c = cand(SHEET.id); if(!c) return closeSheet();
  const rows = rowsFor(idOf(c));
  const notes = S.interview_notes.filter(n => String(n.candidate_id)===String(idOf(c)));
  const acts = S.activity.filter(a => String(a.candidate_id)===String(idOf(c)));
  const docs = S.documents.filter(d => String(d.candidate_id)===String(idOf(c)));
  const prem = c[MAP.candidate.premier] === true;
  const T = SHEET.tab;
  let body = '';
  if(T===0) body = spec([
      ['Title', esc(F(c,'title','headline'))],
      ['Location', esc(F(c,'location'))],
      ['Email', F(c,'email') ? '<a href="mailto:' + esc(F(c,'email')) + '">' + esc(F(c,'email')) + '</a>' : ''],
      ['Phone', F(c,'phone') ? '<a href="tel:' + esc(String(F(c,'phone')).replace(/[^0-9+]/g,'')) + '">' + esc(F(c,'phone')) + '</a>' : ''],
      ['Tags', tagNames(idOf(c)).map(t => '<span class="chip">' + esc(t) + '</span>').join(' ')],
      ['Signal', sigBar(signal(c)) + ' <span class="muted small">outcomes only, never sentiment</span>'],
      ['Premier', prem ? '<span class="premier">Yes</span> · ' + esc(F(c,'premier_reason') || 'no reason recorded') : 'No']
    ]) + '<div class="toggle"><div><b>Premier</b><small>A human call. Turning it on asks you why.</small></div>' +
      '<button class="sw ' + (prem?'on':'') + '" data-prem="' + idOf(c) + '" aria-label="Premier"></button></div>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
        (F(c,'phone') ? '<a class="btn" href="tel:' + esc(String(F(c,'phone')).replace(/[^0-9+]/g,'')) + '">Call</a>' : '') +
        '<button class="btn ghost" data-logcall="' + idOf(c) + '|">Log a call</button>' +
        '<button class="btn ghost" data-note="' + idOf(c) + '|">Interview note</button>' +
        '<button class="btn ghost" data-edit="candidate:' + idOf(c) + '">Edit</button>' +
        (F(c,'email') ? '<button class="btn ghost" data-mail="cand:' + idOf(c) + '">Email</button>' : '') +
        '<button class="btn ghost" data-new="pipeline" data-cand="' + idOf(c) + '">Submit to a search</button></div>';
  if(T===1) body = (notes.length ? notes.sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))).map(n =>
      '<div style="border:1px solid var(--line);padding:16px;border-radius:var(--r)">' +
      '<b>' + esc(F(n,'kind') || 'Interview') + '</b> <span class="muted small">' + day(n.created_at) + (n.search_id ? ' · ' + esc(sname(n.search_id)) : '') + '</span>' +
      spec([['Strong at', esc(F(n,'strong_at','strong'))],['Concerns', esc(F(n,'concerns'))],['Comp', esc(F(n,'comp'))],['Availability', esc(F(n,'availability'))],['Next step', esc(F(n,'next_step','next'))]]) + '</div>').join('')
      : '<p class="muted small">No interview notes yet. Notes live on the candidate, not on one submission, so the whole file travels with them.</p>') +
      '<button class="btn" data-note="' + idOf(c) + '|">Add an interview note</button>';
  if(T===2) body = spec([
      ['Submitted', rows.filter(p => stageIx(p)>=1).length],
      ['Interviewed', rows.filter(p => stageIx(p)>=2 && stageOf(p)!=='Passed').length],
      ['Offers', rows.filter(p => stageIx(p)>=3 && stageOf(p)!=='Passed').length],
      ['Placements', S.placements.filter(p => String(p.candidate_id)===String(idOf(c))).length]
    ]) + (rows.length ? logList(rows.map(p => [esc(sname(p.search_id)), stageOf(p) + ' · ' + esc(cname((search(p.search_id)||{}).company_id))])) : '');
  if(T===3) body = logList(acts.sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))).slice(0,40)
      .map(a => [short(a.created_at) + ' ' + esc(F(a,'kind')), esc(F(a,'body','note'))]));
  if(T===4) body = (docs.length ? logList(docs.map(d => [short(d.created_at), esc(F(d,'name','title','kind'))]))
      : '<p class="muted small">No files yet. Drop a resume on the add form and the branded profile lands here.</p>') +
      '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
        '<button class="btn ghost" data-prof="' + idOf(c) + '">Branded profile PDF</button>' +
        '<button class="btn ghost" data-prof="' + idOf(c) + '" data-redact="1">Client copy, no contact info</button>' +
      '</div>';
  shell(esc(F(c,'name','full_name')) + '.', esc(F(c,'title','headline')) + (F(c,'location') ? ' · ' + esc(F(c,'location')) : ''),
    tabs(['Profile','Notes','History','Activity','Documents']) + body);
}
function sheetPool(){
  const p = byId(S.pools, SHEET.id); if(!p) return closeSheet();
  const mem = S.pool_members.filter(m => String(m.pool_id)===String(idOf(p)));
  shell(esc(F(p,'name')) + '.', mem.length + ' candidates',
    (mem.length ? mem.map(m => { const c = cand(m.candidate_id); if(!c) return '';
      return '<div class="toggle"><div><b>' + esc(F(c,'name','full_name')) + '</b><small>' + esc(F(c,'title','headline')) + '</small></div>' +
        '<button class="btn sm ghost" data-cand="' + idOf(c) + '">Open</button></div>'; }).join('')
      : '<p class="muted small">Empty pool. Add candidates from their profile.</p>') +
    '<div class="field"><label for="poolAdd">Add a candidate</label><select id="poolAdd"><option value="">Pick someone</option>' +
      S.candidates.map(c => '<option value="' + idOf(c) + '">' + esc(F(c,'name','full_name')) + '</option>').join('') + '</select></div>' +
    '<button class="btn" data-pooladd="' + idOf(p) + '">Add to the pool</button>');
}

/* ---------- Mail: written by a recruiter, sent as that recruiter ---------- */
const firstName = n => String(n || '').trim().split(/\s+/)[0] || 'there';
function mailPdf(ctx){ const c = ctx && ctx.cand ? cand(ctx.cand) : null; return c && F(c,'branded_resume_path') ? c : null; }
function mailAdv(ctx){
  if(!ctx || !ctx.pipe) return null;
  const p = byId(S.pipeline, ctx.pipe);
  return p && ['Sourced','Screened'].indexOf(stageOf(p)) >= 0 ? p : null;
}
function mailPeople(ctx){
  const out = [];
  const co = ctx && ctx.co;
  const list = co ? contactsOf(co) : S.contacts;
  list.forEach(ct => { const em = F(ct,'email'); if(em)
    out.push('<option data-kind="contact" value="' + esc(em + '|' + (F(ct,'name') || '')) + '">' + esc(F(ct,'name')) + ' · ' + esc(cname(ct.company_id)) + '</option>'); });
  if(ctx && ctx.cand){ const c = cand(ctx.cand); const em = c && F(c,'email');
    if(em) out.unshift('<option data-kind="cand" value="' + esc(em + '|' + (F(c,'name') || '')) + '">' + esc(F(c,'name')) + ' · candidate</option>'); }
  return '<option value="">Pick someone</option>' + out.join('');
}
/* drafts. plain, short, and always editable before it goes. */
function mailDraft(tpl, ctx){
  const c = ctx && ctx.cand ? cand(ctx.cand) : null;
  const s = ctx && ctx.se ? search(ctx.se) : null;
  const role = s ? F(s,'title','role') : 'the role';
  const co = s ? cname(s.company_id) : (ctx && ctx.co ? cname(ctx.co) : 'the client');
  const who = c ? F(c,'name') : 'the candidate';
  const title = c ? F(c,'title') : '';
  const sel = $('#f_who');
  const toName = sel && sel.value ? sel.value.split('|')[1] : '';
  if(tpl === 'presentation') return { subject: who + ' for ' + role,
    body: firstName(toName) + ',\n\nI am sending you ' + who + ' for the ' + role + ' search.' +
      (title ? ' They are currently ' + title + '.' : '') + '\n\nWhat stands out:\n\nTheir profile is attached. If you want time with them, send me two windows that work and I will set it up.' };
  if(tpl === 'reachout' && !s) return { subject: 'A role worth a look',
    body: firstName(who) + ',\n\nI am working a search that looks close to your background' + (title ? ' as ' + title : '') + '.' +
      '\n\nAre you open to a short call this week? If the timing is wrong, tell me what you are looking for and I will keep it in mind.' };
  if(tpl === 'reachout') return { subject: role + ' search',
    body: firstName(who) + ',\n\nI am running a ' + role + ' search for a client' + (co && co !== 'the client' ? ' in ' + (F(company(s ? s.company_id : ctx.co) || {}, 'city') || 'the area') : '') +
      '.' + (title ? ' With your background as ' + title + ', it looks worth a conversation.' : '') +
      '\n\nAre you open to a short call this week? If the timing is wrong, tell me what you are looking for and I will keep it in mind.' };
  if(tpl === 'followup') return { subject: 'Following up on ' + who,
    body: firstName(toName) + ',\n\nThanks for seeing ' + who + '. What did you think?' +
      '\n\nIf you want to move forward I will get the next step on the calendar. If it is a no, tell me what missed and I will adjust the search.' };
  return { subject: '', body: '' };
}
function wireMailForm(ctx){
  const tpl = $('#f_tpl'), who = $('#f_who'), subj = $('#f_subj'), body = $('#f_body');
  if(ctx && ctx.tpl && tpl) tpl.value = ctx.tpl;
  /* a presentation goes to the client, a reach out goes to the candidate */
  const pick = () => {
    const want = tpl.value === 'reachout' ? 'cand' : 'contact';
    for(let i = 1; i < who.options.length; i++){ if(who.options[i].dataset.kind === want){ who.selectedIndex = i; return; } }
    if(who.options.length > 1) who.selectedIndex = 1;
  };
  pick();
  const fill = () => { const d = mailDraft(tpl.value, ctx); subj.value = d.subject; body.value = d.body; };
  fill();
  tpl.onchange = () => { pick(); fill(); };
  who.onchange = () => { if(!body.value.trim() || confirm('Rewrite the draft for this person?')) fill(); };
}

/* resume drop: upload the original with the staff token, let the backend read it, fill the form */
let RESUME = null;
function wireResumeDrop(){
  RESUME = null;
  const z = document.getElementById('rdrop'), inp = document.getElementById('rfile');
  if(!z || !inp) return;
  const say = (t, s) => { document.getElementById('rdropt').textContent = t; if(s != null) document.getElementById('rdrops').textContent = s; };
  const take = async file => {
    if(!file) return;
    if(!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) return toast('PDF only for now. Word files are next.', true);
    if(file.size > 8000000) return toast('That file is over 8MB.', true);
    say('Reading ' + file.name, 'Uploading, then reading it on the server.');
    try{
      await alive();
      const safe = file.name.replace(/[^A-Za-z0-9._-]+/g, '-').slice(0, 60);
      const path = 'originals/' + Date.now() + '-' + safe;
      const up = await fetch(LW.url + '/storage/v1/object/resumes/' + path, { method:'POST',
        headers:{ apikey: LW.anon, Authorization:'Bearer ' + LWAuth.token(), 'content-type':'application/pdf', 'x-upsert':'true' }, body: file });
      if(!up.ok){ const t = await up.text(); throw new Error('upload refused. ' + t.slice(0, 160)); }
      const j = await Promise.race([fnCall('resume-read', { path }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('No answer from the reader in two minutes.')), 120000))]);
      const p = j.parsed || {};
      const set = (id, v) => { const e = document.getElementById(id); if(e && v && !e.value) e.value = v; };
      set('f_name', p.name); set('f_title', p.title); set('f_email', p.email); set('f_phone', p.phone); set('f_loc', p.location); set('f_notes', p.summary);
      RESUME = { path, parsed: p };
      say('Read ' + file.name + '.', (p.sections || []).length + ' sections, ' + (p.tags || []).length + ' skills. ' +
        (p.source === 'model' ? 'Check the fields, then save.' : 'Rough read only, the model was not available' + (j.note ? ' (' + j.note.slice(0, 80) + ')' : '') + '. Check every field.'));
      if(!p.name) toast('Could not find a name in that file, type it in.', true);
    }catch(err){ say('Could not read that one.', err.message); toast(err.message, true); console.error(err); }
  };
  z.onclick = () => inp.click();
  inp.onchange = () => take(inp.files[0]);
  z.ondragover = e => { e.preventDefault(); z.style.borderColor = 'var(--yellow,#E3BD3B)'; };
  z.ondragleave = () => { z.style.borderColor = ''; };
  z.ondrop = e => { e.preventDefault(); z.style.borderColor = ''; take(e.dataTransfer.files[0]); };
}

    const d = document.getElementById('f_desc'); if(d) d.value = invoiceLine(p);
    const a = document.getElementById('f_amt');
    if(a && !a.value){
      const fee = num(F(p,'fee_amount','fee')) || Math.round(num(F(p,'base_salary','salary')) * (num(p.fee_pct || 20) / 100));
      if(fee) a.value = fee;
    }
    const due = document.getElementById('f_due');
    if(due && F(p,'start_date')){
      const st = new Date(F(p,'start_date')); st.setDate(st.getDate() + 30);
      due.value = st.toISOString().slice(0,10);
    }
  };
  pl.onchange = fill;
  if(pl.value) fill();
}
const today = () => new Date().toISOString().slice(0,10);

    if(!val('f_start')) return toast('A placement needs a start date.', true);

function wireSheet(){
  const sh = $('#sheet');
  sh.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { SHEET.tab = +b.dataset.tab; paintSheet(); });
  sh.querySelectorAll('[data-room]').forEach(b => b.onclick = async () => {
    const ct = byId(S.contacts, b.dataset.room);
    const r = await tryWrite(() => patch('contacts', b.dataset.room, { [MAP.contact.room]: !(ct[MAP.contact.room] === true) }),
      ct[MAP.contact.room] === true ? 'Room access off.' : 'Room access on.');
    if(r){ await loadAll(); paintSheet(); }
  });
  sh.querySelectorAll('[data-prof]').forEach(b => b.onclick = async () => {
    const lbl = b.textContent; b.disabled = true; b.textContent = 'Building';
    try{ const j = await fnCall('profile-pdf', { candidate_id: b.dataset.prof, redact: b.dataset.redact === '1' });
      if(j.url) openUrl(j.url); toast('Profile ' + j.ref + ' ready.'); }
    catch(err){ toast('No PDF. ' + err.message, true); }
    b.disabled = false; b.textContent = lbl;
  });
  sh.querySelectorAll('[data-bill]').forEach(b => b.onclick = async () => {
    const ct = byId(S.contacts, b.dataset.bill); if(!ct) return;
    const on = !(ct[MAP.contact.billing] === true);
    if(on && !F(ct,'email')) return toast('That contact needs a work email first.', true);
    const others = contactsOf(ct.company_id).filter(x => String(idOf(x)) !== String(idOf(ct)) && x[MAP.contact.billing] === true);
    const r = await tryWrite(async () => {
      if(on) for(const o of others) await patch('contacts', idOf(o), { [MAP.contact.billing]: false });
      return patch('contacts', idOf(ct), { [MAP.contact.billing]: on });
    }, on ? 'Invoices go to ' + F(ct,'name') + '.' : 'Billing contact cleared.');
    if(r){ await loadAll(); paintSheet(); }
  });
  sh.querySelectorAll('[data-prem]').forEach(b => b.onclick = async () => {
    const c = cand(b.dataset.prem);
    if(c[MAP.candidate.premier] === true){
      const r = await tryWrite(() => patch('candidates', idOf(c), { [MAP.candidate.premier]: false, [MAP.candidate.premier_reason]: null, [MAP.candidate.premier_by]: null }), 'Premier off.');
      if(r){ await loadAll(); paintSheet(); }
    } else form('premier', { cand: idOf(c) });
  });
  sh.querySelectorAll('[data-close]').forEach(b => b.onclick = async () => {
    const s = search(b.dataset.close);
    const r = await tryWrite(() => patch('searches', idOf(s), { [MAP.search.status]: isOpen(s) ? 'closed' : 'open' }), 'Status changed.');
    if(r){ await loadAll(); drawNav(); paintSheet(); draw(); }
  });
  sh.querySelectorAll('[data-pooladd]').forEach(b => b.onclick = async () => {
    const c = val('poolAdd'); if(!c) return toast('Pick someone first.', true);
    const r = await tryWrite(() => insert('pool_members', { [MAP.poolmem.pool]: b.dataset.pooladd, [MAP.poolmem.candidate]: c }), 'Added to the pool.');
    if(r){ await loadAll(); paintSheet(); }
  });
  common(sh);
}
function common(root){
  root.querySelectorAll('[data-co]').forEach(b => { if(b.dataset.new) return;
    b.onclick = e => { e.stopPropagation(); openSheet('company', b.dataset.co); }; });
  root.querySelectorAll('[data-se]').forEach(b => { if(b.dataset.new) return;
    b.onclick = e => { e.stopPropagation(); openSheet('search', b.dataset.se); }; });
  root.querySelectorAll('[data-cand]').forEach(b => { if(b.dataset.new) return;
    b.onclick = e => { e.stopPropagation(); openSheet('candidate', b.dataset.cand); }; });
  root.querySelectorAll('[data-pool]').forEach(b => b.onclick = e => { e.stopPropagation(); openSheet('pool', b.dataset.pool); });
  const ab = root.querySelector('#addBtn');
  if(ab) ab.onclick = e => { e.stopPropagation(); ab.parentElement.classList.toggle('on'); };
  root.querySelectorAll('.add .menu button').forEach(b => b.addEventListener('click', () => {
    const a = b.closest('.add'); if(a) a.classList.remove('on');

  root.querySelectorAll('[data-new]').forEach(b => b.onclick = e => { e.stopPropagation();

  root.querySelectorAll('[data-logcall]').forEach(b => b.onclick = e => { e.stopPropagation();
    const [c, co] = b.dataset.logcall.split('|'); form('call', { cand: c, co: co }); });

     still opens, this only records that it happened. */

      await insert('activity', clean({
        [MAP.activity.kind]: kind,

        [MAP.activity.candidate]: id,
        [MAP.activity.staff]: meId() || undefined
      }));
      await loadAll(); draw();
    }catch(err){ console.warn('touch not logged', err.message); }
  }));
  root.querySelectorAll('[data-note]').forEach(b => b.onclick = e => { e.stopPropagation();
    const [c, s] = b.dataset.note.split('|'); form('note', { cand: c, se: s }); });
  root.querySelectorAll('[data-fillnote]').forEach(b => b.onclick = e => { e.stopPropagation();
    form('note', { edit: b.dataset.fillnote }); });
  root.querySelectorAll('[data-scope]').forEach(b => b.onclick = e => { e.stopPropagation();
    SCOPE = b.dataset.scope; draw(); });
  root.querySelectorAll('[data-adv]').forEach(b => b.onclick = async e => { e.stopPropagation();
    const p = byId(S.pipeline, b.dataset.adv);
    const next = STAGES[Math.min(4, stageIx(p) + 1)];
    const r = await tryWrite(() => patch('pipeline', idOf(p), { [MAP.pipeline.stage]: dbStage(next) }), 'Moved to ' + next + '.');
    if(r){ await loadAll(); drawNav(); draw(); if(SHEET.kind && SHEET.kind !== 'form') paintSheet(); }
  });
  root.querySelectorAll('[data-rel]').forEach(b => b.onclick = async e => { e.stopPropagation();
    const p = byId(S.pipeline, b.dataset.rel);
    const now = !isReleased(p);
    const r = await tryWrite(() => patch('pipeline', idOf(p), { [MAP.pipeline.released]: now, [MAP.pipeline.released_at]: now ? new Date().toISOString() : null }), now ? 'Released to the client room.' : 'Held back.');
    if(r){ await loadAll(); draw(); if(SHEET.kind && SHEET.kind !== 'form') paintSheet(); }
  });
  root.querySelectorAll('[data-done]').forEach(b => b.onclick = async e => { e.stopPropagation();
    const r = await tryWrite(() => patch('tasks', b.dataset.done, { [MAP.task.done]: true, done_at: new Date().toISOString() }), 'Done.');
    if(r){ await loadAll(); drawNav(); draw(); }
  });
  root.querySelectorAll('[data-v]').forEach(b => { if(b.closest('#nav')) return; b.onclick = () => go(b.dataset.v); });
}

      if(el.dataset.bk === 'search_id' && el.value){ const s = search(el.value); if(s && s.company_id) BATCH.company_id = s.company_id; }
      draw(); await stampAll(); });
    m.querySelectorAll('[data-bk="campaign"]').forEach(el => el.oninput = () => { BATCH.campaign = el.value; });
    const sa = m.querySelector('#isaveall'); if(sa) sa.onclick = intakeSaveAll;
    const ra = m.querySelector('#ireadall'); if(ra) ra.onclick = intakeReadAll;
    const cl = m.querySelector('#iclear'); if(cl) cl.onclick = () => {
      for(let i = INTAKE.length - 1; i >= 0; i--) if(INTAKE[i].status === 'saved') INTAKE.splice(i, 1);
      draw(); };
    m.querySelectorAll('[data-iretry]').forEach(b => b.onclick = () => { const x = INTAKE[+b.dataset.iretry]; if(x){ x.status = 'held'; x.error = ''; } intakeReadAll(); });
  }
  m.querySelectorAll('[data-send]').forEach(b => b.onclick = async e => { e.stopPropagation();
    const i = byId(S.invoices, b.dataset.send); if(!i) return;
    const kind = b.dataset.kind, co = cname(i.company_id);
    const what = kind === 'send' ? 'Send invoice ' + (F(i,'invoice_no','number')||'') + ' to the billing contact at ' + co + '?'
                                 : 'Send a payment reminder to ' + co + '?';
    if(!confirm(what + '\n\nThe PDF goes with it and the send is logged.')) return;
    const lbl = b.textContent; b.disabled = true; b.textContent = 'Sending';
    try{
      const j = await fnCall('invoice-mail', { invoice_id: idOf(i), kind });
      toast('Sent to ' + j.to + '.');
      await loadAll(); drawNav(); draw();
    }catch(err){ toast('Not sent. ' + err.message, true); console.error(err);
      b.disabled = false; b.textContent = lbl; }
  });
  m.querySelectorAll('[data-paid]').forEach(b => b.onclick = async e => { e.stopPropagation();
    const i = byId(S.invoices, b.dataset.paid); if(!i) return;
    if(!confirm('Mark ' + (F(i,'invoice_no','number')||'this invoice') + ' paid? Reminders stop.')) return;
    const r = await tryWrite(() => patch('invoices', idOf(i), { status:'paid', paid_at: today() }), 'Marked paid.');
    if(r){ await loadAll(); drawNav(); draw(); }
  });
  m.querySelectorAll('[data-pdf]').forEach(b => b.onclick = async e => { e.stopPropagation();
    const lbl = b.textContent; b.disabled = true; b.textContent = 'Building';
    try{
      const j = await fnCall('invoice-pdf', { invoice_id: b.dataset.pdf });
      if(j.url) openUrl(j.url);
      toast('Invoice ' + j.number + ' ready.');
      await loadAll(); draw();
    }catch(err){ toast('No PDF. ' + err.message, true); console.error(err); }
    b.disabled = false; b.textContent = lbl; });
  m.querySelectorAll('[data-stab]').forEach(b => b.onclick = () => { Q.searchTab = b.dataset.stab; draw(); });
  m.querySelectorAll('[data-tag]').forEach(b => b.onclick = () => { Q.tag = b.dataset.tag; draw(); });
  m.querySelectorAll('[data-auto]').forEach(b => b.onclick = async () => {
    const k = b.dataset.auto;
    const row = S.automations.filter(x => x.trigger === k || x.name === k)[0];
    const now = !(row && row[MAP.automation.enabled] === true);
    const label = (AUTOS.filter(a => a[0] === k)[0] || [k, k])[1];
    const r = row
      ? await tryWrite(() => patch('automations', idOf(row), { [MAP.automation.enabled]: now }), now ? 'On.' : 'Off.')
      : await tryWrite(() => insert('automations', { [MAP.automation.name]: label, [MAP.automation.trigger]: k, [MAP.automation.enabled]: now }), now ? 'On.' : 'Off.');
    if(r){ await loadAll(); draw(); }
  });
  const qc = document.getElementById('qcand');
  if(qc) qc.oninput = () => { Q.cand = qc.value; const p = qc.selectionStart; draw();
    const n = document.getElementById('qcand'); if(n){ n.focus(); n.setSelectionRange(p,p); } };
  const qo = document.getElementById('qco');
  if(qo) qo.oninput = () => { Q.co = qo.value; const p = qo.selectionStart; draw();
    const n = document.getElementById('qco'); if(n){ n.focus(); n.setSelectionRange(p,p); } };
}
$('#veil').onclick = closeSheet;
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

/* ============================ boot ============================ */
LWAuth.gate(document.getElementById('gate'), async function(staff){
  ME = staff;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = '';
  document.getElementById('meName').textContent = F(staff,'name','email');
  document.getElementById('meRole').textContent = 'The Desk · ' + (F(staff,'role') || 'staff');
  document.getElementById('signout').onclick = e => { e.preventDefault(); LWAuth.signOut(); };
  
  $('#scrim').onclick = closeDrawer;
  const jump = (location.hash || '').replace('#','');
  if(NAV.some(([k]) => k === jump)) VIEW = jump;
  try{ await loadAll(); }catch(e){ toast('Could not load. ' + e.message, true); }
  try{ intakeRestore(); }catch(e){ console.warn('tray', e.message); }
  drawNav(); draw();
});
</script>
</body>
</html>
