<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Desk. LIVEWORK</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="lw.css">
<style>
body{background:var(--paper)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
/* rail */
.rail{background:var(--ink);color:var(--white);padding:28px 20px;display:flex;flex-direction:column;gap:32px;position:sticky;top:0;height:100vh}
.rail img{height:20px;margin-left:4px}
.rail nav{display:grid;gap:2px}
.rail nav button{display:flex;align-items:center;justify-content:space-between;width:100%;height:44px;padding:0 12px;border:0;border-radius:var(--r);background:transparent;color:#BDB9B1;font-weight:600;font-size:15px;text-align:left;cursor:pointer}
.rail nav button:hover{color:var(--white);background:#161616}
.rail nav button.on{color:var(--ink);background:var(--yellow)}
.rail nav button .n{font-size:12px;font-weight:600;opacity:.7}
.rail nav button.on .n{opacity:1}
.rail .me{margin-top:auto;font-size:13px;color:#BDB9B1;line-height:1.4}
.rail .me b{display:block;color:var(--white)}
/* main */
.main{padding:32px 40px 96px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}
.top h1{font-size:44px}
.top .acts{display:flex;gap:10px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:1px solid var(--line);background:var(--white);border-radius:var(--r);width:min(420px,100%)}
.search input{border:0;background:transparent;width:100%;height:100%;outline:0}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
/* tables */
.tbl{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl .r{display:grid;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);cursor:pointer}
.tbl .r:last-child{border-bottom:0}
.tbl .r:hover{background:var(--paper)}
.tbl .h{font-size:12px;font-weight:600;color:var(--stone);cursor:default;background:var(--paper)}
.tbl .h:hover{background:var(--paper)}
.tbl .r b{font-weight:600}
.tbl .tags{display:flex;gap:6px;flex-wrap:wrap}
.tbl .tags .chip{height:24px;font-size:12px;padding:0 8px}
.st{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--stone)}
.st.open::before,.st.released::before,.st.interview::before{background:var(--yellow-deep)}
.st.placed::before,.st.paid::before,.st.signed::before,.st.sent::before{background:var(--ok)}
.st.offer::before{background:var(--ink)}
.st.passed::before,.st.overdue::before{background:var(--warn)}
.empty{padding:40px 20px;color:var(--stone)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:32px}
.stat{background:var(--white);padding:24px}
.stat b{display:block;font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat span{font-size:13px;color:var(--stone)}
.stat.y{background:var(--yellow)}
.stat.y span{color:var(--ink)}
/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px}
.col{background:var(--wall);border-radius:var(--r);padding:12px;min-height:320px}
.col h4{font-size:13px;font-weight:600;color:var(--stone);margin:4px 4px 12px;display:flex;justify-content:space-between}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px;cursor:pointer}
.card b{font-weight:600;display:block}
.card .m{display:block;font-size:13px;color:var(--stone)}
.card .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.card .acts button{height:28px;padding:0 10px;border:1px solid var(--line);background:var(--white);border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer}
.card .acts button:hover{background:var(--ink);color:var(--white);border-color:var(--ink)}
.card.rel{border-left:4px solid var(--yellow)}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}
.veil.on{display:block}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--white);z-index:21;transform:translateX(100%);transition:transform .2s;overflow:auto;padding:32px 36px 48px;display:grid;gap:24px;align-content:start}
.sheet.on{transform:none}
.sheet .x{position:absolute;top:20px;right:20px;width:40px;height:40px;border:1px solid var(--line);background:var(--white);border-radius:var(--r);cursor:pointer;font-size:18px}
.sheet h2{font-size:34px;padding-right:48px}
.sheet .sub{color:var(--stone);margin-top:6px}
.sheet h3{font-size:13px;font-weight:600;color:var(--stone);margin-bottom:10px}
.sheet .spec .row{padding:12px 0}
.sheet .tags{display:flex;gap:6px;flex-wrap:wrap}
.log{display:grid;gap:8px;font-size:14px}
.log div{display:grid;grid-template-columns:96px 1fr;gap:12px}
.log span{color:var(--stone);font-size:13px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r)}
.toggle b{font-weight:600;display:block}
.toggle small{color:var(--stone)}
.sw{width:48px;height:28px;border-radius:14px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--white)}
.sw.on{background:var(--ink)}
.sw.on::after{left:23px;background:var(--yellow)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:12px 18px;border-radius:var(--r);font-weight:600;font-size:14px;display:none;z-index:30}
.toast.on{display:block}
/* docs */
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.doc{background:var(--white);border:1px solid var(--line);padding:24px;display:grid;gap:12px;align-content:start;min-height:220px}
.doc h3{font-size:22px}
.doc p{font-size:14px;color:var(--stone)}
.doc .btn{justify-self:start;margin-top:auto}
.doc.y{background:var(--yellow)}
.doc.y p{color:var(--ink)}
/* mail */
.auto{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.auto .toggle{background:var(--white);border:0;border-radius:0;padding:18px 20px}
@media (max-width:900px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:16px}.rail nav{display:flex;flex-wrap:wrap}.rail .me{display:none}.main{padding:24px 20px 80px}.stats{grid-template-columns:1fr 1fr}.docs{grid-template-columns:1fr}.top h1{font-size:34px}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <img src="livework-primary-all-yellow.png" alt="LIVE | WORK">
    <nav id="nav"></nav>
    <div class="me"><b>Derek Germann</b>The Desk · LIVEWORK</div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="veil" id="veil"></div>
<aside class="sheet" id="sheet"></aside>
<div class="toast" id="toast"></div>

<script>
/* ===== DEMO DATA (replaced by the live layer) ===== */
const DB = {
  companies: [
    {id:'c1', name:'Northwind Logistics', city:'Irvine, CA', kind:'retained', fee:'28% of first year base', billing:'One third at engagement, one third at shortlist, one third at start', guarantee:'12 months', contacts:[{name:'Maria Delgado', title:'VP Operations', email:'maria@northwind.example'}], contracts:[{name:'Retained search agreement', signed:'Aug 12, 2026', status:'signed'},{name:'Mutual NDA', signed:'Aug 12, 2026', status:'signed'}]},
    {id:'c2', name:'Bellhaven Health', city:'Newport Beach, CA', kind:'contingent', fee:'22% of first year base', billing:'Net 30 from start date', guarantee:'90 days', contacts:[{name:'James Okafor', title:'Director of Talent', email:'james@bellhaven.example'}], contracts:[{name:'Contingent search agreement', signed:'Aug 28, 2026', status:'signed'}]},
    {id:'c3', name:'Ardent Solar', city:'San Diego, CA', kind:'retained', fee:'30% of first year base', billing:'Half at engagement, half at start', guarantee:'12 months', contacts:[{name:'Priya Nair', title:'COO', email:'priya@ardent.example'}], contracts:[{name:'Retained search agreement', signed:'', status:'sent'}]},
  ],
  searches: [
    {id:'s1', companyId:'c1', title:'Director of Fleet Operations', location:'Irvine, CA', comp:'$165k to $185k', status:'open', tags:['operations','fleet','logistics','leadership'], opened:'Aug 14, 2026'},
    {id:'s2', companyId:'c1', title:'Warehouse Manager, Night Shift', location:'Santa Fe Springs, CA', comp:'$95k to $110k', status:'open', tags:['warehouse','operations','manager'], opened:'Aug 20, 2026'},
    {id:'s3', companyId:'c2', title:'Clinical Recruiter', location:'Hybrid, Newport Beach', comp:'$85k plus bonus', status:'shortlist', tags:['recruiting','healthcare','hybrid'], opened:'Aug 29, 2026'},
    {id:'s4', companyId:'c3', title:'VP of Engineering', location:'Remote, US', comp:'$240k plus equity', status:'open', tags:['engineering','leadership','remote','solar'], opened:'Sep 2, 2026'},
    {id:'s5', companyId:'c2', title:'Controller', location:'Newport Beach, CA', comp:'$150k', status:'placed', tags:['finance','accounting','leadership'], opened:'Jul 8, 2026'},
  ],
  candidates: [
    {id:'p1', name:'Elena Vasquez', title:'Regional Operations Manager', location:'Orange County, CA', email:'elena@example.com', tags:['operations','fleet','logistics','leadership'], premier:true, source:'Referral', added:'Aug 15, 2026', notes:'Ran 60 trucks across 3 sites. Wants a director seat. Available in 30 days.', resume:'vasquez-resume.pdf'},
    {id:'p2', name:'Marcus Reed', title:'Fleet Supervisor', location:'Long Beach, CA', email:'marcus@example.com', tags:['fleet','operations'], premier:false, source:'LinkedIn', added:'Aug 16, 2026', notes:'Strong on routing software. Lighter on P&L.', resume:'reed-resume.pdf'},
    {id:'p3', name:'Dana Whitfield', title:'Warehouse Manager', location:'Norwalk, CA', email:'dana@example.com', tags:['warehouse','operations','manager'], premier:true, source:'Inbound', added:'Aug 21, 2026', notes:'Currently on nights. Open to a lateral move for a better culture.', resume:'whitfield-resume.pdf'},
    {id:'p4', name:'Samuel Park', title:'Shift Lead', location:'Anaheim, CA', email:'sam@example.com', tags:['warehouse','operations'], premier:false, source:'Job board', added:'Aug 22, 2026', notes:'', resume:'park-resume.pdf'},
    {id:'p5', name:'Aisha Bello', title:'Senior Healthcare Recruiter', location:'Costa Mesa, CA', email:'aisha@example.com', tags:['recruiting','healthcare','hybrid'], premier:true, source:'Referral', added:'Aug 30, 2026', notes:'Placed 40 nurses last year. Wants hybrid.', resume:'bello-resume.pdf'},
    {id:'p6', name:'Tom Lindqvist', title:'Recruiter', location:'Irvine, CA', email:'tom@example.com', tags:['recruiting'], premier:false, source:'LinkedIn', added:'Aug 31, 2026', notes:'', resume:'lindqvist-resume.pdf'},
    {id:'p7', name:'Grace Chen', title:'VP Engineering', location:'Austin, TX', email:'grace@example.com', tags:['engineering','leadership','remote'], premier:true, source:'Network', added:'Sep 3, 2026', notes:'Scaled a 12 to 70 person org. Passive, needs a real mission. Solar is a pull.', resume:'chen-resume.pdf'},
    {id:'p8', name:'Rafael Ortiz', title:'Engineering Manager', location:'Denver, CO', email:'rafael@example.com', tags:['engineering','remote','solar'], premier:false, source:'Inbound', added:'Sep 3, 2026', notes:'Came from a solar EPC. Manager level today.', resume:'ortiz-resume.pdf'},
    {id:'p9', name:'Linda Moore', title:'Controller', location:'Newport Beach, CA', email:'linda@example.com', tags:['finance','accounting','leadership'], premier:false, source:'Referral', added:'Jul 10, 2026', notes:'Placed at Bellhaven. Started Aug 18.', resume:'moore-resume.pdf'},
    {id:'p10', name:'Kevin Adeyemi', title:'Logistics Analyst', location:'Riverside, CA', email:'kevin@example.com', tags:['logistics','analytics'], premier:false, source:'Job board', added:'Sep 4, 2026', notes:'Good bench for future fleet roles.', resume:'adeyemi-resume.pdf'},
  ],
  pipeline: [
    {id:'x1', candidateId:'p1', searchId:'s1', stage:'interview', released:true, log:[['Aug 15','Added to search'],['Aug 18','Screened by DG'],['Aug 19','Released to Northwind'],['Aug 26','Maria: advance'],['Aug 28','Interview set Sep 9']]},
    {id:'x2', candidateId:'p2', searchId:'s1', stage:'screened', released:false, log:[['Aug 16','Added to search'],['Aug 20','Screened by DG']]},
    {id:'x3', candidateId:'p10', searchId:'s1', stage:'sourced', released:false, log:[['Sep 4','Added to search']]},
    {id:'x4', candidateId:'p3', searchId:'s2', stage:'released', released:true, log:[['Aug 21','Added to search'],['Aug 23','Screened by DG'],['Aug 25','Released to Northwind']]},
    {id:'x5', candidateId:'p4', searchId:'s2', stage:'sourced', released:false, log:[['Aug 22','Added to search']]},
    {id:'x6', candidateId:'p5', searchId:'s3', stage:'offer', released:true, log:[['Aug 30','Added to search'],['Sep 1','Released to Bellhaven'],['Sep 3','James: advance'],['Sep 5','Offer out, $88k']]},
    {id:'x7', candidateId:'p6', searchId:'s3', stage:'passed', released:true, log:[['Aug 31','Added'],['Sep 2','Released'],['Sep 3','James: pass, wants more healthcare depth']]},
    {id:'x8', candidateId:'p7', searchId:'s4', stage:'screened', released:false, log:[['Sep 3','Added to search'],['Sep 4','Screened by DG, premier']]},
    {id:'x9', candidateId:'p8', searchId:'s4', stage:'sourced', released:false, log:[['Sep 3','Added to search']]},
    {id:'x10', candidateId:'p9', searchId:'s5', stage:'placed', released:true, log:[['Jul 10','Added'],['Jul 14','Released'],['Jul 29','Offer accepted'],['Aug 18','Started']]},
  ],
  placements: [
    {pipelineId:'x10', start:'Aug 18, 2026', base:'$150,000', fee:'$33,000', invoices:[{no:'LW-1001', due:'Sep 17, 2026', amount:'$33,000', status:'sent'}], guaranteeEnds:'Nov 16, 2026'},
  ],
  automations: [
    {id:'a1', name:'Candidate released', trigger:'When a candidate is released to a search, the client contacts get a profile summary with a link to the room.', on:true},
    {id:'a2', name:'Feedback requested', trigger:'Three days after a release with no client feedback, one reminder to the client.', on:true},
    {id:'a3', name:'Stage changed', trigger:'Interview set, offer out, offer accepted, start confirmed. One line each, to the client.', on:true},
    {id:'a4', name:'Weekly search summary', trigger:'Every Monday 7:00 AM Pacific, one email per open search: released, in interview, next step.', on:true},
    {id:'a5', name:'Candidate outreach', trigger:'When you add a candidate to a search, a short note from you to the candidate with the role and a reply link.', on:false},
    {id:'a6', name:'Invoice due', trigger:'Placement invoice sent on the start date and a reminder at due date plus 7.', on:true},
    {id:'a7', name:'Guarantee ending', trigger:'Fourteen days before a guarantee period ends, a check in to the client.', on:true},
  ],
  queue: [
    {to:'james@bellhaven.example', subject:'Offer out: Aisha Bello, Clinical Recruiter', when:'Today 9:12 AM', status:'sent'},
    {to:'maria@northwind.example', subject:'Your searches this week', when:'Mon 7:00 AM', status:'sent'},
    {to:'maria@northwind.example', subject:'Feedback on Dana Whitfield?', when:'Aug 28', status:'sent'},
    {to:'priya@ardent.example', subject:'Your retained search agreement is ready to sign', when:'Sep 2', status:'sent'},
    {to:'maria@northwind.example', subject:'Interview set: Elena Vasquez, Sep 9', when:'Aug 28', status:'sent'},
  ]
};
const STAGES = ['sourced','screened','released','interview','offer','placed'];
const STAGE_LABEL = {sourced:'Sourced',screened:'Screened',released:'Released',interview:'Interview',offer:'Offer',placed:'Placed',passed:'Passed'};
const KIND = {retained:'Retained', contingent:'Contingent'};

/* ===== helpers ===== */
const $ = s => document.querySelector(s);
const co = id => DB.companies.find(c=>c.id===id);
const se = id => DB.searches.find(s=>s.id===id);
const ca = id => DB.candidates.find(p=>p.id===id);
const esc = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tags = a => `<div class="tags">${a.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`;
const st = s => `<span class="st ${s}">${STAGE_LABEL[s]||s[0].toUpperCase()+s.slice(1)}</span>`;
let toastT; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}
function today(){return new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'})}

/* ===== views ===== */
const VIEWS = {
  overview:{label:'Overview'},
  companies:{label:'Companies', n:()=>DB.companies.length},
  searches:{label:'Searches', n:()=>DB.searches.filter(s=>s.status!=='closed'&&s.status!=='placed').length},
  candidates:{label:'Candidates', n:()=>DB.candidates.length},
  pipeline:{label:'Pipeline'},
  placements:{label:'Placements', n:()=>DB.placements.length},
  documents:{label:'Documents'},
  mail:{label:'Mail'},
};
let view='overview', state={q:'', tag:null, premier:false, search:null};

function nav(){
  $('#nav').innerHTML = Object.entries(VIEWS).map(([k,v])=>`<button class="${k===view?'on':''}" data-v="${k}"><span>${v.label}</span>${v.n?`<span class="n">${v.n()}</span>`:''}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
}
function render(){ nav(); $('#main').innerHTML = R[view](); bind(); }
function head(title, acts=''){ return `<div class="top"><h1>${title}</h1><div class="acts">${acts}</div></div>`; }

const R = {
  overview(){
    const open = DB.searches.filter(s=>['open','shortlist'].includes(s.status));
    const released = DB.pipeline.filter(x=>x.released && !['placed','passed'].includes(x.stage));
    const waiting = DB.pipeline.filter(x=>x.stage==='released');
    const premier = DB.candidates.filter(p=>p.premier);
    return head('Today.') + `
      <div class="stats">
        <div class="stat"><b>${open.length}</b><span>open searches</span></div>
        <div class="stat"><b>${released.length}</b><span>candidates with clients</span></div>
        <div class="stat y"><b>${waiting.length}</b><span>waiting on client feedback</span></div>
        <div class="stat"><b>${premier.length}</b><span>premier candidates in the pool</span></div>
      </div>
      <div class="tools"><b>Needs a move</b></div>
      <div class="tbl">
        <div class="r h" style="grid-template-columns:2fr 2fr 1fr 1.4fr"><span>Candidate</span><span>Search</span><span>Stage</span><span>Last</span></div>
        ${DB.pipeline.filter(x=>!['placed','passed'].includes(x.stage)).map(x=>`<div class="r" style="grid-template-columns:2fr 2fr 1fr 1.4fr" data-open="pipe:${x.id}"><b>${ca(x.candidateId).premier?'<span class="premier">':''}${esc(ca(x.candidateId).name)}${ca(x.candidateId).premier?'</span>':''}</b><span>${esc(se(x.searchId).title)}<br><span class="small muted">${esc(co(se(x.searchId).companyId).name)}</span></span>${st(x.stage)}<span class="small muted">${x.log.at(-1)[0]} · ${esc(x.log.at(-1)[1])}</span></div>`).join('')}
      </div>`;
  },
  companies(){
    return head('Companies.', `<button class="btn sm" data-new="company">Add a company</button>`) + `
      <div class="tbl">
        <div class="r h" style="grid-template-columns:2fr 1.2fr 1fr 1.4fr 1fr"><span>Company</span><span>City</span><span>Engagement</span><span>Fee</span><span>Open searches</span></div>
        ${DB.companies.map(c=>`<div class="r" style="grid-template-columns:2fr 1.2fr 1fr 1.4fr 1fr" data-open="co:${c.id}"><b>${esc(c.name)}</b><span>${esc(c.city)}</span><span class="chip ${c.kind==='retained'?'y':''}">${KIND[c.kind]}</span><span>${esc(c.fee)}</span><span>${DB.searches.filter(s=>s.companyId===c.id&&['open','shortlist'].includes(s.status)).length}</span></div>`).join('')}
      </div>`;
  },
  searches(){
    return head('Searches.', `<button class="btn sm" data-new="search">Open a search</button>`) + `
      <div class="tbl">
        <div class="r h" style="grid-template-columns:2.2fr 1.6fr 1fr 1fr 2fr"><span>Role</span><span>Company</span><span>Status</span><span>In play</span><span>Tags</span></div>
        ${DB.searches.map(s=>`<div class="r" style="grid-template-columns:2.2fr 1.6fr 1fr 1fr 2fr" data-open="se:${s.id}"><b>${esc(s.title)}<br><span class="small muted" style="font-weight:400">${esc(s.location)} · ${esc(s.comp)}</span></b><span>${esc(co(s.companyId).name)}</span>${st(s.status)}<span>${DB.pipeline.filter(x=>x.searchId===s.id&&!['placed','passed'].includes(x.stage)).length}</span>${tags(s.tags)}</div>`).join('')}
      </div>`;
  },
  candidates(){
    const all = [...new Set(DB.candidates.flatMap(p=>p.tags))].sort();
    let list = DB.candidates.filter(p=>{
      if(state.premier && !p.premier) return false;
      if(state.tag && !p.tags.includes(state.tag)) return false;
      if(state.q){const q=state.q.toLowerCase(); if(!(p.name+' '+p.title+' '+p.location+' '+p.tags.join(' ')+' '+p.notes).toLowerCase().includes(q)) return false;}
      return true;
    });
    list.sort((a,b)=>(b.premier-a.premier)||a.name.localeCompare(b.name));
    return head('Candidates.', `<button class="btn ghost sm" data-new="upload">Upload a batch</button><a class="btn sm" href="resume.html">Drop a resume</a>`) + `
      <div class="tools">
        <label class="search"><span class="muted">Search</span><input id="q" value="${esc(state.q)}" placeholder="name, title, note, tag"></label>
        <button class="chip ${state.premier?'on':''}" data-prem>Premier only</button>
        ${all.map(t=>`<button class="chip ${state.tag===t?'on':''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}
      </div>
      <div class="tbl">
        <div class="r h" style="grid-template-columns:2fr 1.8fr 1.2fr 2fr 1fr"><span>Name</span><span>Title</span><span>Location</span><span>Tags</span><span>In searches</span></div>
        ${list.length? list.map(p=>`<div class="r" style="grid-template-columns:2fr 1.8fr 1.2fr 2fr 1fr" data-open="ca:${p.id}"><b>${p.premier?`<span class="premier">${esc(p.name)}</span>`:esc(p.name)}</b><span>${esc(p.title)}</span><span>${esc(p.location)}</span>${tags(p.tags)}<span>${DB.pipeline.filter(x=>x.candidateId===p.id).length}</span></div>`).join('') : `<div class="empty">No one matches. Clear a filter or add a candidate.</div>`}
      </div>`;
  },
  pipeline(){
    const open = DB.searches.filter(s=>s.status!=='closed');
    if(!state.search) state.search = open[0].id;
    const s = se(state.search);
    const rows = DB.pipeline.filter(x=>x.searchId===s.id);
    return head('Pipeline.') + `
      <div class="tools">
        <label class="field" style="min-width:320px"><select id="pickSearch">${open.map(o=>`<option value="${o.id}" ${o.id===s.id?'selected':''}>${esc(o.title)} · ${esc(co(o.companyId).name)}</option>`).join('')}</select></label>
        <span class="muted small">${KIND[co(s.companyId).kind]} · ${esc(co(s.companyId).fee)}</span>
      </div>
      <div class="board">
        ${STAGES.map(stg=>{const cards=rows.filter(x=>x.stage===stg);return `<div class="col"><h4><span>${STAGE_LABEL[stg]}</span><span>${cards.length}</span></h4>${cards.map(x=>{const p=ca(x.candidateId);const i=STAGES.indexOf(stg);return `<div class="card ${x.released?'rel':''}" data-open="pipe:${x.id}"><b>${p.premier?`<span class="premier">${esc(p.name)}</span>`:esc(p.name)}</b><span class="m">${esc(p.title)}</span><span class="m">${x.released?'In the client room':'Not yet released'}</span><div class="acts">${i>0?`<button data-move="${x.id}:${STAGES[i-1]}">Back</button>`:''}${i<STAGES.length-1?`<button data-move="${x.id}:${STAGES[i+1]}">${STAGE_LABEL[STAGES[i+1]]}</button>`:''}<button data-move="${x.id}:passed">Pass</button></div></div>`}).join('')}</div>`}).join('')}
      </div>
      ${rows.some(x=>x.stage==='passed')?`<p class="small muted" style="margin-top:12px">Passed: ${rows.filter(x=>x.stage==='passed').map(x=>esc(ca(x.candidateId).name)).join(', ')}</p>`:''}`;
  },
  placements(){
    return head('Placements.') + `
      <div class="tbl">
        <div class="r h" style="grid-template-columns:2fr 1.6fr 1fr 1fr 1.2fr 1.2fr"><span>Placed</span><span>Company</span><span>Start</span><span>Fee</span><span>Invoice</span><span>Guarantee ends</span></div>
        ${DB.placements.map(pl=>{const x=DB.pipeline.find(x=>x.id===pl.pipelineId);const p=ca(x.candidateId);const s=se(x.searchId);const inv=pl.invoices[0];return `<div class="r" style="grid-template-columns:2fr 1.6fr 1fr 1fr 1.2fr 1.2fr" data-open="pipe:${x.id}"><b>${esc(p.name)}<br><span class="small muted" style="font-weight:400">${esc(s.title)}</span></b><span>${esc(co(s.companyId).name)}</span><span>${pl.start}</span><span>${pl.fee}</span><span>${st(inv.status)} <span class="small muted">${inv.no}</span></span><span>${pl.guaranteeEnds}</span></div>`}).join('')}
      </div>`;
  },
  documents(){
    return head('Documents.') + `
      <p class="lede" style="margin-bottom:28px">Templates fill from the company record: fee, billing schedule, guarantee, contacts. Generated documents file under the company.</p>
      <div class="docs">
        <div class="doc y"><h3>Retained search agreement</h3><p>Exclusive engagement. Fee, three part billing schedule, timeline, replacement guarantee, off limits terms.</p><button class="btn ink sm" data-gen="retained">Generate</button></div>
        <div class="doc"><h3>Contingent search agreement</h3><p>Pay on placement. Fee, invoice on start date, guarantee period, candidate ownership window.</p><button class="btn sm" data-gen="contingent">Generate</button></div>
        <div class="doc"><h3>Placement confirmation</h3><p>Sent when an offer is accepted. Names the candidate, role, start date, base, fee and the invoice it triggers.</p><button class="btn sm" data-gen="placement">Generate</button></div>
        <div class="doc"><h3>Candidate release</h3><p>The candidate's consent to present their profile to a named client.</p><button class="btn sm" data-gen="release">Generate</button></div>
        <div class="doc"><h3>Mutual NDA</h3><p>Standard two way confidentiality for a search.</p><button class="btn sm" data-gen="nda">Generate</button></div>
        <div class="doc"><h3>Invoice</h3><p>Fee invoice from a placement, numbered LW-1000 up, with the billing terms from the agreement.</p><button class="btn sm" data-gen="invoice">Generate</button></div>
      </div>`;
  },
  mail(){
    return head('Mail.') + `
      <div class="tools"><b>Automations</b><span class="muted small">Sent from hello@livework.inc. Every email links back into the client room.</span></div>
      <div class="auto" style="margin-bottom:32px">
        ${DB.automations.map(a=>`<div class="toggle"><div><b>${esc(a.name)}</b><small>${esc(a.trigger)}</small></div><button class="sw ${a.on?'on':''}" data-auto="${a.id}" aria-label="Toggle ${esc(a.name)}"></button></div>`).join('')}
      </div>
      <div class="tools"><b>Recent</b></div>
      <div class="tbl">
        <div class="r h" style="grid-template-columns:1.6fr 2.4fr 1fr .8fr"><span>To</span><span>Subject</span><span>When</span><span>Status</span></div>
        ${DB.queue.map(m=>`<div class="r" style="grid-template-columns:1.6fr 2.4fr 1fr .8fr;cursor:default"><span>${esc(m.to)}</span><b>${esc(m.subject)}</b><span class="small muted">${m.when}</span>${st(m.status)}</div>`).join('')}
      </div>`;
  }
};

/* ===== sheets ===== */
function open(kind,id){
  const el=$('#sheet'); el.innerHTML = `<button class="x" aria-label="Close">×</button>` + S[kind](id); el.classList.add('on'); $('#veil').classList.add('on');
  el.querySelector('.x').onclick=close; bindSheet();
}
function close(){$('#sheet').classList.remove('on');$('#veil').classList.remove('on')}
$('#veil').onclick=close;

const S = {
  co(id){const c=co(id);const ss=DB.searches.filter(s=>s.companyId===id);return `
    <div><h2>${esc(c.name)}</h2><p class="sub">${esc(c.city)} · ${KIND[c.kind]} client</p></div>
    <div><h3>Engagement terms</h3><div class="spec">
      <div class="row"><b>Engagement</b><span>${KIND[c.kind]} search</span></div>
      <div class="row"><b>Fee</b><span>${esc(c.fee)}</span></div>
      <div class="row"><b>Billing</b><span>${esc(c.billing)}</span></div>
      <div class="row"><b>Guarantee</b><span>${esc(c.guarantee)} replacement</span></div>
    </div></div>
    <div><h3>Contracts on file</h3><div class="spec">${c.contracts.map(k=>`<div class="row"><b>${esc(k.name)}</b><span>${st(k.status)} ${k.signed?`<span class="small muted">${k.signed}</span>`:''}</span></div>`).join('')}</div>
      <div style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost sm" data-gen="${c.kind}">Generate agreement</button><button class="btn ghost sm" data-up>Upload a signed copy</button></div></div>
    <div><h3>People with room access</h3><div class="spec">${c.contacts.map(k=>`<div class="row"><b>${esc(k.name)}</b><span>${esc(k.title)}<br><span class="small muted">${esc(k.email)}</span></span></div>`).join('')}</div>
      <button class="btn ghost sm" style="margin-top:12px" data-invite="${c.id}">Invite a contact</button></div>
    <div><h3>Searches</h3><div class="spec">${ss.map(s=>`<div class="row" style="cursor:pointer" data-open="se:${s.id}"><b>${esc(s.title)}</b><span>${st(s.status)}</span></div>`).join('')||'<p class="muted small">No searches yet.</p>'}</div></div>`},
  se(id){const s=se(id);const c=co(s.companyId);const rows=DB.pipeline.filter(x=>x.searchId===id);return `
    <div><h2>${esc(s.title)}</h2><p class="sub">${esc(c.name)} · ${esc(s.location)} · ${esc(s.comp)}</p></div>
    <div><h3>Status</h3><div style="display:flex;gap:8px;flex-wrap:wrap">${['open','shortlist','offer','placed','closed'].map(k=>`<button class="chip ${s.status===k?'on':''}" data-status="${s.id}:${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div></div>
    <div><h3>Tags on this search</h3>${tags(s.tags)}<p class="small muted" style="margin-top:8px">Candidates carrying these tags surface first when you add to this search.</p></div>
    <div><h3>Terms</h3><div class="spec"><div class="row"><b>Engagement</b><span>${KIND[c.kind]}</span></div><div class="row"><b>Fee</b><span>${esc(c.fee)}</span></div><div class="row"><b>Opened</b><span>${s.opened}</span></div></div></div>
    <div><h3>Candidates</h3><div class="spec">${rows.map(x=>{const p=ca(x.candidateId);return `<div class="row" style="cursor:pointer" data-open="pipe:${x.id}"><b>${p.premier?`<span class="premier">${esc(p.name)}</span>`:esc(p.name)}</b><span>${st(x.stage)} ${x.released?'<span class="small muted">· in room</span>':''}</span></div>`}).join('')||'<p class="muted small">Nobody in this search yet.</p>'}</div>
      <button class="btn sm" style="margin-top:12px" data-addto="${s.id}">Add candidates from the pool</button></div>`},
  ca(id){const p=ca(id);const rows=DB.pipeline.filter(x=>x.candidateId===id);return `
    <div><h2>${esc(p.name)}</h2><p class="sub">${esc(p.title)} · ${esc(p.location)}</p></div>
    <div class="toggle"><div><b>Premier candidate</b><small>Floats to the top of every search and is held for priority placement.</small></div><button class="sw ${p.premier?'on':''}" data-premier="${p.id}" aria-label="Toggle premier"></button></div>
    <div><h3>Tags</h3>${tags(p.tags)}<div style="display:flex;gap:8px;margin-top:10px"><input class="chip" style="height:32px" placeholder="add a tag" data-addtag="${p.id}"></div></div>
    <div><h3>Resume</h3><div class="spec"><div class="row"><b>${esc(p.resume)}</b><span><a href="#" data-noop>Open</a> · <a href="#" data-noop>Replace</a></span></div><div class="row"><b>Email</b><span>${esc(p.email)}</span></div><div class="row"><b>Source</b><span>${esc(p.source)} · added ${p.added}</span></div></div></div>
    <div><h3>Notes</h3><div class="field"><textarea data-notes="${p.id}">${esc(p.notes)}</textarea></div></div>
    <div><h3>Searches</h3><div class="spec">${rows.map(x=>{const s=se(x.searchId);return `<div class="row" style="cursor:pointer" data-open="pipe:${x.id}"><b>${esc(s.title)}<br><span class="small muted" style="font-weight:400">${esc(co(s.companyId).name)}</span></b><span>${st(x.stage)}</span></div>`}).join('')||'<p class="muted small">Not in a search yet.</p>'}</div>
      <button class="btn sm" style="margin-top:12px" data-addcand="${p.id}">Add to a search</button></div>`},
  pipe(id){const x=DB.pipeline.find(x=>x.id===id);const p=ca(x.candidateId);const s=se(x.searchId);const c=co(s.companyId);const pl=DB.placements.find(pl=>pl.pipelineId===id);return `
    <div><h2>${esc(p.name)}</h2><p class="sub">${esc(s.title)} at ${esc(c.name)}</p></div>
    <div class="toggle"><div><b>Released to ${esc(c.name)}</b><small>${x.released?'Their contacts can see this profile in the client room.':'Only you can see this profile. Flip to release.'}</small></div><button class="sw ${x.released?'on':''}" data-release="${x.id}" aria-label="Toggle release"></button></div>
    <div><h3>Stage</h3><div style="display:flex;gap:8px;flex-wrap:wrap">${[...STAGES,'passed'].map(k=>`<button class="chip ${x.stage===k?'on':''}" data-move="${x.id}:${k}">${STAGE_LABEL[k]}</button>`).join('')}</div></div>
    ${pl?`<div><h3>Placement</h3><div class="spec"><div class="row"><b>Start</b><span>${pl.start}</span></div><div class="row"><b>Base</b><span>${pl.base}</span></div><div class="row"><b>Fee</b><span>${pl.fee} (${esc(c.fee)})</span></div>${pl.invoices.map(i=>`<div class="row"><b>${i.no}</b><span>${i.amount} · due ${i.due} · ${st(i.status)}</span></div>`).join('')}<div class="row"><b>Guarantee</b><span>ends ${pl.guaranteeEnds}</span></div></div></div>`:''}
    <div><h3>Paper trail</h3><div class="log">${x.log.map(l=>`<div><span>${esc(l[0])}</span><span style="color:var(--ink)">${esc(l[1])}</span></div>`).join('')}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" data-open="ca:${p.id}">Candidate record</button><button class="btn ghost sm" data-open="se:${s.id}">Search</button><button class="btn ghost sm" data-open="co:${c.id}">Company</button></div>`}
};

/* ===== actions ===== */
function move(id,stage){const x=DB.pipeline.find(x=>x.id===id);x.stage=stage;x.log.push([today(),`Moved to ${STAGE_LABEL[stage]}`]);if(['released','interview','offer','placed'].includes(stage)&&!x.released){x.released=true;x.log.push([today(),`Released to ${co(se(x.searchId).companyId).name}`]);}toast(`${ca(x.candidateId).name}: ${STAGE_LABEL[stage]}`);render();if($('#sheet').classList.contains('on'))open('pipe',id)}
function bind(){
  document.querySelectorAll('[data-open]').forEach(el=>el.onclick=e=>{e.stopPropagation();const [k,id]=el.dataset.open.split(':');open(k,id)});
  document.querySelectorAll('[data-move]').forEach(b=>b.onclick=e=>{e.stopPropagation();const [id,s]=b.dataset.move.split(':');move(id,s)});
  const q=$('#q'); if(q){q.oninput=()=>{state.q=q.value;const pos=q.selectionStart;render();$('#q').focus();$('#q').setSelectionRange(pos,pos)}}
  document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{state.tag=state.tag===b.dataset.tag?null:b.dataset.tag;render()});
  const pr=$('[data-prem]'); if(pr)pr.onclick=()=>{state.premier=!state.premier;render()};
  const ps=$('#pickSearch'); if(ps)ps.onchange=()=>{state.search=ps.value;render()};
  document.querySelectorAll('[data-auto]').forEach(b=>b.onclick=()=>{const a=DB.automations.find(a=>a.id===b.dataset.auto);a.on=!a.on;toast(`${a.name}: ${a.on?'on':'off'}`);render()});
  document.querySelectorAll('[data-gen]').forEach(b=>b.onclick=()=>toast('Document generation wires up with the live layer'));
  document.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>toast('Forms arrive with the live layer'));
}
function bindSheet(){
  const sh=$('#sheet');
  sh.querySelectorAll('[data-open]').forEach(el=>el.onclick=e=>{e.stopPropagation();const [k,id]=el.dataset.open.split(':');open(k,id)});
  sh.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const [id,s]=b.dataset.move.split(':');move(id,s)});
  sh.querySelectorAll('[data-release]').forEach(b=>b.onclick=()=>{const x=DB.pipeline.find(x=>x.id===b.dataset.release);x.released=!x.released;x.log.push([today(),x.released?`Released to ${co(se(x.searchId).companyId).name}`:'Pulled from the client room']);toast(x.released?'Released. Client contacts get an email.':'Pulled from the room.');render();open('pipe',x.id)});
  sh.querySelectorAll('[data-premier]').forEach(b=>b.onclick=()=>{const p=ca(b.dataset.premier);p.premier=!p.premier;toast(p.premier?'Marked premier':'Premier removed');render();open('ca',p.id)});
  sh.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{const [id,s]=b.dataset.status.split(':');se(id).status=s;render();open('se',id)});
  sh.querySelectorAll('[data-addtag]').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter'&&i.value.trim()){const p=ca(i.dataset.addtag);p.tags.push(i.value.trim().toLowerCase());render();open('ca',p.id)}});
  sh.querySelectorAll('[data-notes]').forEach(t=>t.onchange=()=>{ca(t.dataset.notes).notes=t.value;toast('Notes saved')});
  sh.querySelectorAll('[data-gen],[data-up],[data-invite],[data-addto],[data-addcand],[data-noop]').forEach(b=>b.onclick=e=>{e.preventDefault();toast('Wires up with the live layer')});
}
render();
</script>
</body>
</html>
